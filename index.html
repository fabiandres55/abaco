<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#565b60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abanico">
<meta name="application-name" content="Abanico">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Abanico · Bodega y Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
  :root{
    --pri:#6f757a;--pri-d:#565b60;--pri-l:#828990;--fab:#5f656a;
    --ink:#20232a;--muted:#6c7177;--faint:#9aa0a6;--line:#e6e7ea;--line2:#f0f1f3;
    --bg:#f3f4f5;--card:#ffffff;--sel:#eceef0;--green:#2e7d4f;--red:#c8452f;--amber:#b07414;
    --ui:"Roboto",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;touch-action:manipulation;overscroll-behavior:none;max-width:100%;overflow-x:hidden}
  body{margin:0;font-family:var(--ui);color:var(--ink);background:linear-gradient(160deg,#3a3d42,#181a1d);
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .device{position:relative;width:100%;max-width:412px;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  @media (max-width:479px){body{align-items:flex-start}}
  /* tablets / pantallas medianas (táctil): marco tipo teléfono (como hasta ahora) */
  @media (min-width:480px){.device{max-width:440px;height:min(900px,94vh);max-height:94vh;border-radius:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);border:1px solid #000}}
  /* ESCRITORIO (Windows/macOS con mouse): ocupa toda la ventana del navegador */
  @media (hover:hover) and (pointer:fine) and (min-width:820px){
    body{background:var(--bg)}
    .device{max-width:none;width:100%;height:100vh;height:100dvh;max-height:100dvh;border-radius:0;box-shadow:none;border:none}
  }

  .statusbar{flex:none;height:26px;background:var(--pri-d);color:#eceef0;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:500;gap:6px}
  .statusbar .sb-r{margin-left:auto;display:flex;align-items:center;gap:6px}
  .statusbar svg{width:14px;height:14px;fill:#eceef0}

  .appbar{flex:none;background:var(--pri);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;padding-top:env(safe-area-inset-top,0px);height:calc(56px + env(safe-area-inset-top,0px));box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;z-index:6}
  .iconbtn{width:44px;height:44px;border:none;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:50%}
  .iconbtn:active{background:rgba(255,255,255,.15)}
  .iconbtn svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .appbar .title{margin-left:4px;flex:1;min-width:0;line-height:1.15}
  .appbar .title .t1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .title .t2{font-size:12.5px;color:#e6e8ea;font-weight:400}
  .badge-dot{position:absolute;top:11px;right:9px;width:7px;height:7px;background:var(--red);border-radius:50%}

  .invhead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .isearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
  .isearch svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9;flex:none}
  .isearch input{border:none;outline:none;background:transparent;font-family:var(--ui);font-size:14px;width:100%;color:var(--ink);min-width:0}
  .isearch .clr{color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;flex:none}
  .round{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none}
  .round svg{width:20px;height:20px;stroke:var(--pri-d);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer}
  .fchip svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .fchip.act{background:var(--pri);color:#fff;border-color:var(--pri)}
  .fchip.act svg{stroke:#fff}
  .fchip.io{border-color:var(--ink);color:var(--ink);font-weight:600}
  .fchip.io svg{stroke:var(--ink)}
  .pcards{display:flex;flex-direction:column;gap:11px}
  .pcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px 14px;cursor:pointer}
  .pcard:active{background:var(--sel)}
  .pc-top{display:flex;align-items:center;gap:13px}
  .pc-img{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--sel);flex:none;overflow:hidden;display:grid;place-items:center}
  .pc-img img{width:100%;height:100%;object-fit:cover}
  .pc-img svg{width:28px;height:28px;stroke:var(--faint);fill:none;stroke-width:1.6}
  .pc-id{flex:1;min-width:0}
  .pc-key{font-size:18px;font-weight:600;color:#3b4046;line-height:1.2;word-break:break-word}
  .pc-name{font-size:14.5px;color:var(--muted);margin-top:1px}
  .origchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;padding:3px 8px 3px 6px;border-radius:20px;margin-top:6px;background:#eceef0;color:#565b60;max-width:100%}
  .origchip svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none}
  .origchip.own{background:#e6f1ea;color:#3a7a4e}
  .rsvpill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:#fde7d6;color:#a8611a;white-space:nowrap}
  .rsvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .rsvtools{display:flex;gap:8px;flex:none}
  .rsvtool{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
  .rsvtool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .tbars{display:flex;flex-direction:column;gap:13px;margin-top:2px}
  .tbar-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
  .tbar-nm{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
  .tbar-track{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}
  .tbar-fill{height:100%;border-radius:6px;transition:width .3s}
  .bkwrap{max-width:520px;margin:0 auto;padding-top:6px}
  .bkhero{width:76px;height:76px;margin:14px auto 4px;border-radius:20px;background:var(--sel);display:grid;place-items:center}
  .bkhero svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.5}
  .bkerr{margin-top:14px;display:flex;gap:8px;align-items:center;background:#fdeceb;color:#b23b32;border-radius:12px;padding:11px 13px;font-size:13px}
  .bkerr svg{width:18px;height:18px;flex:none;stroke:#b23b32;fill:none;stroke-width:1.8}
  .bkok{display:flex;gap:8px;align-items:center;background:#e6f1ea;color:#2f7a4e;border-radius:12px;padding:12px 13px;font-size:13.5px;font-weight:600;margin-bottom:10px}
  .bkok svg{width:18px;height:18px;flex:none;stroke:#2f7a4e;fill:none;stroke-width:2.2}
  .bkload{display:flex;flex-direction:column;align-items:center;gap:16px;padding:70px 0;color:var(--muted)}
  .bkload svg{width:42px;height:42px;stroke:var(--pri);fill:none;stroke-width:2}
  .bks{font-size:13px}
  .spin{animation:bkspin 1s linear infinite;transform-origin:center}
  @keyframes bkspin{to{transform:rotate(360deg)}}
  .bkbiz{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .bkbiz-ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--sel);display:grid;place-items:center}
  .bkbiz-ic svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:1.6}
  .bkbiz-n{font-weight:700;font-size:15px}
  .bkbiz-s{font-size:12px;color:var(--muted);margin-top:2px}
  .kpis3{margin-bottom:8px}
  .bkdates{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin:6px 2px 14px}
  .bkdates svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .bkdates b{color:var(--ink)}
  .loadmore{text-align:center;padding:14px;margin:2px 0 4px;color:var(--pri);font-weight:600;font-size:13.5px;cursor:pointer}
  .sh-rec h2{display:flex;align-items:center;gap:7px}.sh-rec svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.9}
  .scards{display:flex;flex-direction:column;gap:12px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .scard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .scard-fol{font-weight:700;font-size:15px;color:var(--ink)}
  .scard-pay{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .scard-pay svg{width:20px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6;flex:none}
  .scard-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);padding:2px 0}
  .scard-row svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.7;flex:none}
  .scard-row span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .scard-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-top:9px;border-top:1px solid var(--line2)}
  .scard-paid{color:var(--green);font-weight:700;font-size:14px}
  .scard-tot{text-align:right}.scard-tl{display:block;font-size:11px;color:var(--muted)}.scard-tot b{font-size:19px;color:var(--ink)}
  .salehelp{margin-top:22px;font-size:13px;line-height:1.7;color:var(--muted);text-align:center;padding:0 10px}
  .hicon{border:none;background:var(--sel);color:var(--ink);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none}
  .hicon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
  .histdlg{position:absolute;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
  .histdlg.on{display:flex}
  .histbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
  .histbar-t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .histbody{flex:1;overflow-y:auto;padding:14px 14px 24px}
  .clilist{display:flex;flex-direction:column;gap:10px}
  .clicard{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .cli-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
  .cli-ic{width:38px;height:38px;flex:none;border-radius:50%;background:var(--sel);display:grid;place-items:center}
  .cli-ic svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.7}
  .cli-tx{min-width:0}
  .cli-n{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cli-a{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:1px}
  .cli-actions{display:flex;gap:2px;flex:none}
  .cli-act{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none}
  .cli-act:active{background:var(--sel)}
  .cli-act svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .pc-warn{flex:none;align-self:flex-start}.pc-warn svg{width:26px;height:26px}
  .pc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
  .pc-m{text-align:center}.pc-ml{font-size:13px;color:var(--muted)}.pc-mv{font-size:22px;font-weight:700;margin-top:3px}.pc-mv.warnv{color:var(--red)}.pc-mv.warno{color:#c98a12}
  .sheetdlg{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:16;display:none;align-items:flex-end}
  .sheetdlg.on{display:flex}
  .sheetcard{background:var(--card);width:100%;border-radius:16px 16px 0 0;max-height:72%;display:flex;flex-direction:column;padding-bottom:10px;box-shadow:0 -8px 30px -10px rgba(0,0,0,.4)}
  .shwrap{padding:14px 16px 20px}
  .shnologo{text-align:center;font-size:12.5px;color:#b45309;background:#fef3c7;border-radius:8px;padding:8px 10px;margin:-6px 0 14px}
  .shtitle{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
  .shlink{color:var(--pri);text-decoration:underline;cursor:pointer;margin-left:6px}
  .shfmts{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
  .shfmt{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
  .shfmt.on{border-color:var(--pri);color:var(--pri)}
  .shdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
  .shfmt.on .shdot{border-color:var(--pri)}
  .shdot span{width:9px;height:9px;border-radius:50%;background:var(--pri);display:block}
  .shgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .shbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
  .shbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
  .shbtn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .shbtn.wa{color:#25d366;border-color:#25d366}
  .shhint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.4}
  .cfg-id{text-align:center;color:var(--red);font-size:13px;margin:2px 0 16px}
  .cfg-btn{display:block;width:100%;box-sizing:border-box;padding:15px;border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15px;margin-bottom:14px;background:linear-gradient(180deg,#3ec6f0,#20a6dc);cursor:pointer;letter-spacing:.3px}
  .cfg-btn.cfg-orange{background:#f47b3f}
  .cfg-btn.cfg-green{background:#16b45a}
  .cfg-h{text-align:center;color:var(--muted);font-size:14px;margin:18px 0 8px}
  .cfg-row{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:13px 14px;margin-bottom:8px;font-size:14px;color:var(--ink);line-height:1.35}
  .cfg-cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
  .cfg-cb.on{background:var(--pri);border-color:var(--pri)}
  .cfg-cb svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3}
  .cfg-rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
  .cfg-rd.on{border-color:var(--pri)}
  .cfg-rd span{width:11px;height:11px;border-radius:50%;background:var(--pri);display:block}
  .cfg-sel{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;color:var(--ink);margin-bottom:8px}
  .cfg-div{height:2px;background:var(--pri);opacity:.5;margin:22px 0;border-radius:2px}
  .dzone{border:1px solid var(--red);border-radius:12px;padding:14px;margin-top:12px;background:rgba(214,64,64,.05)}
  .dz-t{font-weight:800;color:var(--red);font-size:15px}
  .dz-d{font-size:12.5px;color:var(--muted);margin:4px 0 10px;line-height:1.4}
  .dz-in{width:100%;box-sizing:border-box;margin-bottom:10px}
  .dzone .delbtn{width:100%}
  .rseg{display:flex;gap:8px;justify-content:center;background:var(--bg);border-radius:12px;padding:6px;margin:0 auto 14px;max-width:360px}
  .rseg-i{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .rseg-i.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .rseg-i .rdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
  .rseg-i.on .rdot{border-color:var(--pri)}
  .rseg-i .rdot span{width:9px;height:9px;border-radius:50%;background:var(--pri);display:block}
  .sheetdlg.full{align-items:stretch}
  .sheetdlg.full .sheetcard{max-height:100%;height:100%;border-radius:0;padding-bottom:0}
  .sheet-h{padding:14px 12px 12px 18px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sheet-x{border:none;background:var(--sel);color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;flex:none;display:grid;place-items:center}
  .sheet-x:active{background:var(--line)}
  .sheet-list{overflow-y:auto;padding:4px 0}
  .fmtrow{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
  .fmtrow:last-child{border-bottom:none}
  .fmtrow:active{background:var(--sel)}
  .fmtcode{font-weight:800;font-size:19px;color:var(--ink);width:46px;flex:none;text-align:left}
  .fmtdesc{font-size:13.5px;color:var(--muted);line-height:1.35}
  #scandlg{background:#000}
  #scandlg .histbar{background:#0c0c0c;border-bottom-color:#222}
  #scandlg .histbar-t{color:#fff}
  #scandlg .sheet-x{background:#2a2a2a;color:#eee}
  .scanwrap{position:relative;flex:1;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #quaggaBox{position:absolute;inset:0}
  #quaggaBox video,#quaggaBox canvas{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover}
  #quaggaBox canvas.drawingBuffer{display:none}
  .scanframe{position:relative;z-index:3;width:80%;max-width:340px;aspect-ratio:3/2;border:2px solid rgba(255,255,255,.92);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.5)}
  .scanhint{z-index:3}
  .saleacc{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);background:var(--card)}
  .saleacc .chev{display:inline-flex;transition:transform .15s}.saleacc .chev.op{transform:rotate(180deg)}
  .saleacc .chev svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
  .saleprow{cursor:pointer}
  .cliac{position:absolute;left:0;right:0;top:100%;margin-top:3px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px -6px rgba(0,0,0,.3);z-index:6;max-height:210px;overflow-y:auto;display:none}
  .cliac.on{display:block}

const L=(new URLSearchParams(location.search).get("lang")||navigator.language||"es").slice(0,2).toLowerCase();
const LANG=I18N[L]?L:"en";
const t=k=>I18N[LANG][k]??I18N.en[k]??k;
const UNITS=["u_cubic","u_gram","u_kg","u_liter","u_meter","u_piece"];
// unidades adicionales por defecto (literales, siempre disponibles en el selector)
const UNITS_EXTRA=["Unidad","Centímetro","Mililitro","CM^3","METRO","50 G","25X35CM","Caja","Paquete","Docena","Rollo","Bolsa","Par"];
// forma canónica de una unidad: clave (u_meter…) para las de por defecto, literal para las personalizadas.
// Así "Metro"/"Meter" (misma unidad en es/en) se guardan igual → clave u_meter.
function canonUnit(u){if(u==null)return u;const s=(''+u).trim();if(!s)return s;if(UNITS.includes(s))return s;for(const k of UNITS){if(I18N.es[k]===s||I18N.en[k]===s)return k;}return s;}
function isKnownUnit(u){return UNITS.includes(u)||UNITS_EXTRA.includes(u)||(state.units||[]).includes(u);}
// entradas del selector: {canon, label} sin etiquetas duplicadas
function unitCatalogEntries(){const out=[],seen=new Set();const add=(canon,label)=>{if(label&&!seen.has(label)){seen.add(label);out.push({canon,label});}};UNITS.forEach(k=>add(k,t(k)));UNITS_EXTRA.forEach(u=>add(u,u));(state.units||[]).forEach(u=>{const c=canonUnit(u);add(c,unitLabel(c));});return out;}
// migra unidades guardadas como etiqueta traducida → clave canónica
function migrateUnits(){let ch=false;(state.products||[]).forEach(p=>{const c=canonUnit(p.unit);if(c!==p.unit){p.unit=c;ch=true;}});if(ch)persist();return ch;}

function nid(){const m=state.products.reduce((a,p)=>Math.max(a,+p.id||0),0);state.seq=Math.max((state.seq||1),m+1);const id=state.seq;state.seq=id+1;return id;}
// repara ids duplicados/ausentes (conserva el primero, reasigna los demás)
function ensureUniqueIds(){let changed=false,max=0;const seen=new Set();state.products.forEach(p=>{max=Math.max(max,+p.id||0);});state.products.forEach(p=>{let id=+p.id;if(!id||seen.has(id)){max+=1;p.id=max;changed=true;}else p.id=id;seen.add(p.id);});state.seq=Math.max((state.seq||1),max+1);return changed;}
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

const saleTotal=s=>s.total!=null?s.total:(s.items?s.items.reduce((t,i)=>t+(P(i.id)?.price||0)*i.q,0):0);
const saleQty=s=>s.n!=null?s.n:(s.lines?s.lines.reduce((a,l)=>a+(+l.qty||0),0):(s.items?s.items.reduce((a,i)=>a+i.q,0):0));
const saleProfit=s=>s.cost!=null?(saleTotal(s)-s.cost):(s.items?s.items.reduce((a,i)=>{const p=P(i.id);return a+(p?(p.price-p.cost):0)*i.q;},0):0);
// crédito/por-cobrar = status 2 (numérico o 'cobrar') O tiene abonos registrados (pagos)
const saleIsCreditStrict=s=>{const st=s&&s.status;return st===2||st==='2'||st==='cobrar';};
const saleIsCredit=s=>{if(saleIsCreditStrict(s))return true;return !!(s&&Array.isArray(s.pays)&&s.pays.length);};
const purchaseIsCreditStrict=p=>{const st=p&&p.status;return st==='porpagar'||st===2||st==='2';};
const salePaidSum=s=>Array.isArray(s&&s.pays)?s.pays.reduce((a,p)=>a+(+p.p||0),0):0;
const purchaseIsCredit=p=>{const st=p&&p.status;if(st==='porpagar'||st===2||st==='2')return true;return !!(p&&Array.isArray(p.pays)&&p.pays.length);};

  let items=state.products.filter(p=>p.name.toLowerCase().includes(q)||(p.cat||"").toLowerCase().includes(q)||(p.key||"").toLowerCase().includes(q));

      :`<span class="origchip own">${t('own_product')}</span>`):'';

let SCAN_STREAM=null,SCAN_DETECT=null,SCAN_TIMER=null,SCAN_Q=false,SCAN_TARGET='search',SCAN_BUSY=false;
async function openScanner(target){
  SCAN_TARGET=target||'search';SCAN_BUSY=false;
  document.getElementById('scanH').textContent=t('scan_title');
  document.getElementById('scanHint').textContent=t('scan_hint');
  document.getElementById('scandlg').classList.add('on');
  const video=document.getElementById('scanVideo');
  video.setAttribute('playsinline','');video.setAttribute('muted','');video.muted=true;
  const constraints={video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}};
  // 1) BarcodeDetector nativo (Android Chrome): abrimos el stream y detectamos por frames
  let BD=null;if('BarcodeDetector' in window){try{BD=new window.BarcodeDetector();}catch(e){BD=null;}}
  if(BD){
    try{
      SCAN_STREAM=await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject=SCAN_STREAM;await video.play();
    }catch(e){toast(t('scan_nocam'));return closeScanner();}
    SCAN_DETECT=BD;
    const tick=async()=>{
      if(!SCAN_STREAM||SCAN_BUSY)return;
      try{const codes=await SCAN_DETECT.detect(video);if(codes&&codes.length&&codes[0].rawValue){return onScan(codes[0].rawValue);}}catch(e){}
      SCAN_TIMER=setTimeout(tick,220);
    };
    SCAN_TIMER=setTimeout(tick,400);
    return;
  }
  // 2) QuaggaJS (iOS Safari y navegadores sin BarcodeDetector): Quagga gestiona la cámara
  video.style.display='none';                 // Quagga usa su propio <video>
  const box=document.getElementById('quaggaBox');box.style.display='';box.innerHTML='';
  try{
    if(typeof Quagga==='undefined')await sbScript('https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js');
    if(typeof Quagga==='undefined')throw new Error('quagga');
    await new Promise((res,rej)=>{
      Quagga.init({
        inputStream:{type:'LiveStream',target:box,constraints:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},
        locator:{patchSize:'medium',halfSample:true},
        numOfWorkers:(navigator.hardwareConcurrency||4),
        frequency:10,
        decoder:{readers:['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader','code_39_reader','i2of5_reader']},
        locate:true
      },err=>{if(err)return rej(err);try{Quagga.start();}catch(e){return rej(e);}res();});
    });
    SCAN_Q=true;
    Quagga.onDetected(quaggaHit);
  }catch(e){toast(t('scan_nocam'));return closeScanner();}
}
let QUAGGA_HITS={};
function quaggaHit(result){
  if(SCAN_BUSY)return;
  const code=result&&result.codeResult&&result.codeResult.code;
  if(!code)return;
  // exigir 2 lecturas iguales para evitar falsos positivos
  QUAGGA_HITS[code]=(QUAGGA_HITS[code]||0)+1;
  if(QUAGGA_HITS[code]>=2){QUAGGA_HITS={};onScan(code);}
}
function onScan(code){
  if(SCAN_BUSY)return;SCAN_BUSY=true;
  code=(''+(code||'')).trim();
  closeScanner();
  if(!code)return;
  if(SCAN_TARGET==='key'){
    try{readForm();}catch(e){}
    state.form=state.form||{};state.form.key=code;
    const fb=document.getElementById('formBody');if(fb){fb.innerHTML=formHTML();attachForm();}
    toast(code);return;
  }
  if(SCAN_TARGET==='sale'){
    const p=state.products.find(x=>(''+(x.key||''))===code)||state.products.find(x=>(''+(x.key||'')).toLowerCase()===code.toLowerCase());
    if(p){state.cart[p.id]=(state.cart[p.id]||0)+1;state.q='';state.screen='nueva';render();toast(p.name+' · '+t('sale_added'));}
    else toast(ti('scan_none',{c:code}));
    return;
  }
  if(SCAN_TARGET==='purchase'){
    const p=state.products.find(x=>(''+(x.key||''))===code)||state.products.find(x=>(''+(x.key||'')).toLowerCase()===code.toLowerCase());
    if(p){state.pcart[p.id]=(state.pcart[p.id]||0)+1;state.q='';state.screen='compras';render();toast(p.name+' · '+t('sale_added'));}
    else toast(ti('scan_none',{c:code}));
    return;
  }
  // buscar en el inventario por el número de código de barras
  state.q=code;state.filterCat=null;state.screen='inventario';state.invLimit=INV_PAGE;render();
  const inp=document.getElementById('searchInput');if(inp)inp.value=code;
  const hit=state.products.some(p=>(''+(p.key||'')).toLowerCase()===code.toLowerCase()||(p.name||'').toLowerCase().includes(code.toLowerCase()));
  toast(hit?code:ti('scan_none',{c:code}));
}
function closeScanner(){
  document.getElementById('scandlg').classList.remove('on');
  if(SCAN_TIMER){clearTimeout(SCAN_TIMER);SCAN_TIMER=null;}
  QUAGGA_HITS={};
  if(SCAN_Q){try{Quagga.offDetected(quaggaHit);}catch(e){}try{Quagga.stop();}catch(e){}SCAN_Q=false;}
  const box=document.getElementById('quaggaBox');if(box){box.innerHTML='';box.style.display='none';}
  SCAN_DETECT=null;
  if(SCAN_STREAM){try{SCAN_STREAM.getTracks().forEach(tr=>tr.stop());}catch(e){}SCAN_STREAM=null;}
  const video=document.getElementById('scanVideo');if(video){try{video.pause();}catch(e){}video.srcObject=null;video.style.display='';}
}

async function buildSaleReceiptBlob(sale){
  const JS=await ensurePdfLibs();

  if(!lines.length)return null;
  const cfg=receiptCfg();
  const doc=new JS({unit:'pt',format:'a4'});
  const M=40;const fmtN=n=>Math.round(+n||0).toLocaleString('en-US');

  doc.setFont('helvetica','bold');doc.setFontSize(21);doc.setTextColor(20);doc.text((cfg.name||'').toUpperCase(),M,y);y+=26;
  doc.setFont('helvetica','normal');doc.setFontSize(13);doc.setTextColor(35);
  [cfg.owner,cfg.email,cfg.phone].filter(Boolean).forEach(l=>{doc.text(''+l,M,y);y+=19;});
  if(cfg.msg){y+=8;doc.setFontSize(12);const wrapped=doc.splitTextToSize(''+cfg.msg,515);doc.text(wrapped,M,y);y+=wrapped.length*15;}
  if(sale.addr){y+=12;doc.setFontSize(12);doc.setTextColor(35);const wn=doc.splitTextToSize(''+sale.addr,515);doc.text(wn,M,y);y+=wn.length*15;}
  y+=18;doc.setFontSize(13);doc.setTextColor(20);
  if(sale.client){doc.text(t('sale_client')+': '+sale.client,M,y);y+=26;}
  const folio=sale.folio||sale.id;
  doc.text(t('sale_folio')+': '+folio+'     '+t('sale_date')+': '+(sale.date||todayISO()),M,y);y+=19;
  if(sale.pay){doc.text(t('sale_payform')+': '+sale.pay,M,y);y+=19;}
  const recv=saleTotal(sale)-srPaid(sale)>0.5;
  const statusTxt=recv?t('rc_pending'):t('sale_paid').toUpperCase();
  doc.text(t('rc_status')+':  '+statusTxt,M,y);y+=8;
  const prodW=235,cantW=95,precioW=95,subW=90;
  doc.autoTable({
    startY:y+8,margin:{left:M,right:M},
    head:[[t('rc_product').toUpperCase(),t('cx_qty').toUpperCase(),t('rc_price').toUpperCase(),t('sale_subtotal').toUpperCase()]],
    body:lines.map(l=>[l.name,fmtN(l.qty),fmtN(l.price),fmtN(l.subtotal)]),

    headStyles:{fillColor:[255,255,255],textColor:95,fontStyle:'normal',halign:'center',fontSize:9},
    columnStyles:{0:{cellWidth:prodW,halign:'left',fontSize:8},1:{cellWidth:cantW,halign:'center'},2:{cellWidth:precioW,halign:'center'},3:{cellWidth:subW,halign:'center'}}
  });
  let fy=doc.lastAutoTable.finalY+14;const leftW=prodW+cantW,rightW=precioW+subW,rh=26;
  const paid=srPaid(sale),due=Math.max(0,saleTotal(sale)-paid);
  const frow=(label,val)=>{doc.setDrawColor(205);doc.setLineWidth(0.5);doc.rect(M,fy,leftW,rh);doc.rect(M+leftW,fy,rightW,rh);doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(40);doc.text(label,M+leftW-8,fy+17,{align:'right'});doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(fmtN(val),M+leftW+rightW/2,fy+17,{align:'center'});fy+=rh;};
  frow(t('total').toUpperCase()+' $',saleTotal(sale));
  frow(t('sr_pagos_lbl').toUpperCase()+' $',paid);
  frow(t('sr_total_pay')+' $',due);
  return {blob:doc.output('blob'),name:t('rc_receipt')+' '+folio+'.pdf',folio};
}

async function saleReceiptText(sale){
  const cfg=receiptCfg();const lines=await srLinesFor(sale,await srRawIndex());

  const tot=saleTotal(sale),paid=srPaid(sale),due=Math.max(0,tot-paid),recv=due>0.5;

async function shareContent(kind){
  const s=state.sales.find(x=>''+x.id===''+state.shareSale);if(!s)return;
  const fmt=state.shareFmt||'pdf';
  try{
    if(fmt==='texto'){
      const txt=await saleReceiptText(s);
      if(kind==='download'){await saveWithPicker(t('rc_receipt')+' '+(s.folio||s.id)+'.txt','text/plain',txt);return;}
      if(kind==='whatsapp'){window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return;}
      if(kind==='mail'){window.open('mailto:?subject='+encodeURIComponent(t('rc_receipt')+' '+(s.folio||s.id))+'&body='+encodeURIComponent(txt),'_blank');return;}
      if(navigator.share){try{await navigator.share({text:txt});return;}catch(e){if(e&&e.name==='AbortError')return;}}
      try{await navigator.clipboard.writeText(txt);toast(t('sh_copied'));}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
      return;
    }
    toast(t('rc_generating'));
    const r=fmt==='jpg'?await buildSaleReceiptJPG(s):await buildSaleReceiptBlob(s);
    if(!r){toast(t('rc_none'));return;}
    const mime=fmt==='jpg'?'image/jpeg':'application/pdf';
    if(kind==='download'){const ok=await saveWithPicker(r.name,mime,r.blob);if(ok)toast(t('io_done_exp'));return;}
    // share / whatsapp / mail: usar hoja nativa con archivo (única vía para adjuntar en web)
    const file=new File([r.blob],r.name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:r.name});return;}catch(e){if(e&&e.name==='AbortError')return;}
    }
    // sin Web Share de archivos: descarga y avisa
    const ok=await saveWithPicker(r.name,mime,r.blob);if(ok)toast(t('sh_saved_share'));
  }catch(e){toast(t('io_err'));}
}

/* ============ Total de Transacciones ============ */
function txTotalData(from,to){
  const inRD=d=>!!d&&d>=from&&d<=to;
  const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const inclPagos=state.txtInclPagos!==false;   // incluir pagos sin referencia de transacción
  // Clasificación por cobrar: con "incluir pagos", crédito = status2 O tiene abonos; sin él, solo status2
  const isCredV=inclPagos?saleIsCredit:saleIsCreditStrict;
  const isCredP=inclPagos?purchaseIsCredit:purchaseIsCreditStrict;
  const salesR=state.sales.filter(s=>inRD(saleDate(s)));
  const vp=salesR.filter(s=>!isCredV(s));   // pagadas (contado)
  const vc=salesR.filter(s=>isCredV(s));     // por cobrar
  const ventasPag={n:vp.length,ing:sum(vp,saleTotal),gan:sum(vp,saleProfit)};
  const vcDeuda=vc.reduce((a,s)=>a+Math.max(0,saleTotal(s)-salePaidSum(s)),0);
  // Abonos (Pagos): con "incluir pagos" = TODOS los abonos del rango (incluso de ventas fuera del rango);
  // sin él = solo abonos de ventas status2 cuya venta está en el rango.
  let abonosVentas=0;
  if(inclPagos){state.sales.forEach(s=>{if(Array.isArray(s.pays))s.pays.forEach(p=>{if(inRD(p.f))abonosVentas+=+p.p||0;});});}
  else{salesR.forEach(s=>{if(saleIsCreditStrict(s)&&Array.isArray(s.pays))s.pays.forEach(p=>{if(inRD(p.f))abonosVentas+=+p.p||0;});});}
  const ventasCob={n:vc.length,ing:sum(vc,saleTotal),gan:sum(vc,saleProfit),deuda:vcDeuda,pagos:abonosVentas};
  const purR=(state.purchases||[]).filter(p=>inRD(p.date));
  const cp=purR.filter(p=>!isCredP(p));
  const cc=purR.filter(p=>isCredP(p));
  const comprasPag={n:cp.length,egr:sum(cp,p=>+p.total||0)};
  const ccDeuda=cc.reduce((a,p)=>a+Math.max(0,(+p.total||0)-purchasePaidSum(p)),0);
  let abonosCompras=0;
  if(inclPagos){(state.purchases||[]).forEach(p=>{if(Array.isArray(p.pays))p.pays.forEach(x=>{if(inRD(x.f))abonosCompras+=+x.p||0;});});}
  else{purR.forEach(p=>{if(purchaseIsCreditStrict(p)&&Array.isArray(p.pays))p.pays.forEach(x=>{if(inRD(x.f))abonosCompras+=+x.p||0;});});}
  const comprasPagar={n:cc.length,egr:sum(cc,p=>+p.total||0),deuda:ccDeuda,pagos:abonosCompras};
  const exIn=(state.extraMoves||[]).filter(m=>inRD(m.date)&&m.type==='in');
  const exOut=(state.extraMoves||[]).filter(m=>inRD(m.date)&&m.type==='out');
  const ingExtraPag={n:exIn.length,ing:sum(exIn,m=>+m.amount||0)};
  const gastoExtraPag={n:exOut.length,gas:sum(exOut,m=>+m.amount||0)};
  // TOP = ventas pagadas (contado) + abonos recibidos + ingresos extras
  const ingresos=ventasPag.ing+abonosVentas+ingExtraPag.ing;
  const egresos=comprasPag.egr+abonosCompras+gastoExtraPag.gas;
  // "Total Ingresos/Ganancias (incluye por cobrar)" = TODAS las ventas del rango (invariante)
  const allR={ing:sum(salesR,saleTotal),gan:sum(salesR,saleProfit)};
  return {ventasPag,ventasCob,comprasPag,comprasPagar,ingExtraPag,gastoExtraPag,
    totIng:allR.ing,totGan:allR.gan,ingresos,egresos,balance:ingresos-egresos};
}
function txTotalDays(from,to,type){
  const inclC=state.txtInclCobrar;
  // lista de fechas from..to (máx 180)
  const days=[];const p=from.split('-');let cur=new Date(+p[0],+p[1]-1,+p[2]);const end=(()=>{const q=to.split('-');return new Date(+q[0],+q[1]-1,+q[2]);})();
  let guard=0;const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  while(cur<=end&&guard<400){days.push({date:iso(cur),ing:0,gan:0});cur.setDate(cur.getDate()+1);guard++;}
  const idx={};days.forEach((d,i)=>idx[d.date]=i);
  const add=(date,ing,gan)=>{const i=idx[date];if(i==null)return;days[i].ing+=ing;days[i].gan+=gan||0;};
  if(type==='ventas'){
    if(inclC){state.sales.forEach(s=>add(saleDate(s),saleTotal(s),saleProfit(s)));}
    else{state.sales.forEach(s=>{if(!saleIsCredit(s))add(saleDate(s),saleTotal(s),saleProfit(s));if(Array.isArray(s.pays))s.pays.forEach(p=>add(p.f,+p.p||0,0));});}
  }
  else if(type==='compras'){
    if(inclC){(state.purchases||[]).forEach(pu=>add(pu.date,+pu.total||0,0));}
    else{(state.purchases||[]).forEach(pu=>{if(!purchaseIsCredit(pu))add(pu.date,+pu.total||0,0);if(Array.isArray(pu.pays))pu.pays.forEach(p=>add(p.f,+p.p||0,0));});}
  }
  else if(type==='ing'){(state.extraMoves||[]).forEach(m=>{if(m.type==='in')add(m.date,+m.amount||0,0);});}
  else if(type==='gas'){(state.extraMoves||[]).forEach(m=>{if(m.type==='out')add(m.date,+m.amount||0,0);});}
  return days;
}
function txLineChart(days,type){
  if(!days.length)return `<div class="txempty">${t('tx_chart_empty')}</div>`;

  const H=175,PT=8,PB=8,plot=H-PT-PB;

  const poly=key=>days.map((d,i)=>X(i).toFixed(2)+','+Y(d[key]).toFixed(2)).join(' ');
  const area=key=>`M 0,100 L ${days.map((d,i)=>X(i).toFixed(2)+','+Y(d[key]).toFixed(2)).join(' L ')} L 100,100 Z`;

  const dots=days.map((d,i)=>{const l=X(i);let h=`<span class="lc-dot ing" style="left:${l}%;top:${Y(d.ing)}%"></span>`;if(type==='ventas')h+=`<span class="lc-dot gan" style="left:${l}%;top:${Y(d.gan)}%"></span>`;return h;}).join('');
  const cols=days.map((d,i)=>`<div class="lc-col" data-txtpt="${i}" style="left:${X(i)}%;width:${Math.max(6,100/n)}%"></div>`).join('');

  return `<div class="lchart" style="height:${H}px">${grid}<div class="lc-plot">${svg}${dots}${cols}${tip}</div></div>`;
}

function dowOf(dateStr){const p=(''+dateStr).split('-');if(p.length<3)return 0;return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
function repDayData(){
  const r=repEnsureRange();const from=r.from,to=r.to;
  const days=[0,1,2,3,4,5,6].map(()=>({vN:0,vA:0,cN:0,cA:0,iN:0,iA:0,gN:0,gA:0}));
  state.sales.forEach(s=>{const d=saleDate(s);if(d>=from&&d<=to){const w=dowOf(d);days[w].vN++;days[w].vA+=saleTotal(s);}});
  (state.purchases||[]).forEach(pu=>{const d=pu.date;if(d&&d>=from&&d<=to){const w=dowOf(d);days[w].cN++;days[w].cA+=(+pu.total||0);}});
  // Ingresos/Gastos extras (caja) si traen fecha; si no, se omiten
  (state.extraMoves||[]).forEach(m=>{const d=m.date;if(!d||d<from||d>to)return;const w=dowOf(d);if(m.type==='in'){days[w].iN++;days[w].iA+=(+m.amount||0);}else{days[w].gN++;days[w].gA+=(+m.amount||0);}});
  const tot={v:0,c:0,i:0,g:0};days.forEach(x=>{tot.v+=x.vA;tot.c+=x.cA;tot.i+=x.iA;tot.g+=x.gA;});
  return {days,tot};
}

async function saveWithPicker(name,mime,content){
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  // Escritorio: elegir ruta con el diálogo del sistema
  try{
    if(window.showSaveFilePicker){
      const ext='.'+(name.split('.').pop());
      const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:name.toUpperCase(),accept:{[mime]:[ext]}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();return true;
    }
  }catch(e){if(e&&e.name==='AbortError')return false;}
  // Móvil (iOS/Android): menú Compartir → "Guardar en Archivos"
  try{
    const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  // Respaldo: enlace de descarga
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2500);return true;}catch(e){}
  // Último recurso: abrir en pestaña nueva
  try{window.open(URL.createObjectURL(blob),'_blank');return true;}catch(e){}
  return false;
}

function ioNum(v){
  let s=(''+(v==null?'':v)).trim().replace(/[^0-9.,-]/g,'');if(!s)return 0;
  const hasDot=s.indexOf('.')>=0,hasComma=s.indexOf(',')>=0;
  if(hasDot&&hasComma){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}
  else if(hasComma)s=s.replace(',','.');
  else if(hasDot&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
function ioParseCSV(txt){
  const rows=[];let i=0,cell='',row=[],q=false;
  const push=()=>{row.push(cell);cell='';};const endr=()=>{push();rows.push(row);row=[];};
  while(i<txt.length){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else{if(c==='"')q=true;else if(c===','||c===';')push();else if(c==='\n')endr();else if(c==='\r'){}else cell+=c;}
    i++;
  }
  if(cell.length||row.length)endr();
  if(rows.length<2)return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const idx=names=>{for(const n of names){const k=head.indexOf(n);if(k>=0)return k;}return -1;};
  const ci={key:idx(['codigo','código','key','sku','barcode','codigo de barras']),name:idx(['nombre','name','producto','product']),cat:idx(['categoria','categoría','category','cat']),stock:idx(['cantidad','stock','qty','existencia']),cost:idx(['precio_compra','p_compra','costo','cost','compra']),price:idx(['precio_venta','p_venta','precio','price','venta']),reserve:idx(['reserva','reserve'])};
  const out=[];
  for(let r=1;r<rows.length;r++){const cells=rows[r];if(!cells.length||cells.every(x=>!(''+x).trim()))continue;
    const name=(ci.name>=0?cells[ci.name]:cells[0])||'';if(!name.trim())continue;
    out.push({key:ci.key>=0?(cells[ci.key]||'').trim():'',name:name.trim(),cat:ci.cat>=0?(cells[ci.cat]||'').trim():'',stock:ci.stock>=0?ioNum(cells[ci.stock]):0,cost:ci.cost>=0?ioNum(cells[ci.cost]):0,price:ci.price>=0?ioNum(cells[ci.price]):0,reserve:ci.reserve>=0?ioNum(cells[ci.reserve]):0});
  }
  return out;
}
function importProducts(list,stay){

function handleImportFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const txt=(''+reader.result).replace(/^﻿/,'');const trimmed=txt.trim();
      let prods;
      if(/\.json$/i.test(file.name)||trimmed[0]==='{'||trimmed[0]==='['){const j=JSON.parse(trimmed);prods=Array.isArray(j)?j:(j.products||[]);prods=prods.map(p=>({key:p.key||'',name:p.name||p.nombre||'',cat:p.cat||p.categoria||'',stock:+(p.stock!=null?p.stock:p.cantidad)||0,cost:+(p.cost!=null?p.cost:p.p_compra)||0,price:+(p.price!=null?p.price:p.p_venta)||0,reserve:+(p.reserve!=null?p.reserve:p.reserva)||0}));}
      else prods=ioParseCSV(txt);
      if(!prods||!prods.length){toast(t('io_empty'));return;}
      importProducts(prods.filter(p=>p.name&&(''+p.name).trim()));
    }catch(e){toast(t('io_err'));}
  };
  reader.onerror=()=>toast(t('io_err'));
  reader.readAsText(file);
}

let BKZIP=null;const BK_SQLBASE='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';

const IMGCACHE={};let IDBP=null;
function idbOpen(){
  if(IDBP)return IDBP;
  IDBP=new Promise((res,rej)=>{try{const r=indexedDB.open('abanico',3);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('img'))db.createObjectStore('img');if(!db.objectStoreNames.contains('sale'))db.createObjectStore('sale');if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  return IDBP;
}
async function idbPut(key,val){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('img','readwrite');tx.objectStore('img').put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});}catch(e){return false;}}
async function idbKvPut(key,val){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});}catch(e){return false;}}

let IMG_FETCHING=false;
function bkApplyInvImages(){

async function sbFetchImages(keys){
  if(IMG_FETCHING||!keys.length)return;IMG_FETCHING=true;
  try{
    const sb=await sbInit();const id=currentDataId();
    if(sb&&id){
      const want=keys.slice(0,150).map(k=>'img:'+k);
      const r=await sb.from('store_docs').select('doc_key,data').eq('store_id',id).in('doc_key',want);
      if(r&&r.data){for(const row of r.data){const b=row.data&&row.data.b;if(b){IMGCACHE[row.doc_key]=b;idbPut(row.doc_key,b);}}}

function genEntId(role){const pre=role==='bodega'?'BOD':'TDA';const ex=new Set(loadReg(role).map(x=>x.id));let id;do{id=pre+'-'+Math.random().toString(36).slice(2,6).toUpperCase();}while(ex.has(id));return id;}
function currentDataId(){return state.profile?state.profile.id:null;}
function persist(){const id=currentDataId();if(!id)return;saveDataOf(id,{products:state.products,cats:state.cats,seq:state.seq,extraMoves:state.extraMoves,clients:state.clients,units:state.units,mermas:state.mermas,receipt:state.receipt,purchases:state.purchases,porders:state.porders});sbPushDoc(id,'products',state.products);sbPushDoc(id,'clients',state.clients);sbPushDoc(id,'mermas',state.mermas);sbPushDoc(id,'purchases',state.purchases);sbPushDoc(id,'porders',state.porders);}
function persistLocal(){const id=currentDataId();if(!id)return;saveDataOf(id,{products:state.products,cats:state.cats,seq:state.seq,extraMoves:state.extraMoves,clients:state.clients,units:state.units,mermas:state.mermas,receipt:state.receipt,purchases:state.purchases,porders:state.porders});}
function receiptCfg(){const r=state.receipt||{};return {name:(r.name||(state.profile&&state.profile.name)||'Abanico'),owner:r.owner||'',email:r.email||'',phone:r.phone||'',msg:r.msg||'',logo:r.logo||(state.profile&&state.profile.logo)||''};}
// Logo de la tienda arriba a la derecha de la página actual del PDF; devuelve la y inferior del logo (0 si no hay)
let _pdfLogo={src:null,data:null};
function rawLogo(){let reg='';try{const p=state.profile;const e=p&&getEntity(p.kind,p.id);reg=(e&&e.logo)||'';}catch(_){}return (state.receipt&&state.receipt.logo)||(state.profile&&state.profile.logo)||reg||'';}
// Convierte el logo (cualquier formato que el navegador muestre) a JPEG sobre blanco: siempre compatible con jsPDF
function prepPdfLogo(){
  const src=rawLogo();
  if(!src){_pdfLogo={src:'',data:null};return Promise.resolve(null);}
  if(_pdfLogo.src===src&&_pdfLogo.data)return Promise.resolve(_pdfLogo.data);
  return new Promise(res=>{try{const img=new Image();img.onload=()=>{try{const max=400;const sc=Math.min(max/img.width,max/img.height,1);const w=Math.max(1,Math.round(img.width*sc)),hh=Math.max(1,Math.round(img.height*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(img,0,0,w,hh);const d=cv.toDataURL('image/jpeg',0.92);_pdfLogo={src,data:d};res(d);}catch(e){res(null);}};img.onerror=()=>res(null);img.src=src;}catch(e){res(null);}});
}
// Logo de la tienda arriba a la derecha de la página actual del PDF; devuelve la y inferior del logo (0 si no hay)
function pdfLogo(doc,opt){const src=rawLogo();if(!src)return 0;const lg=(_pdfLogo.src===src&&_pdfLogo.data)?_pdfLogo.data:src;try{const o=opt||{};const pw=doc.internal.pageSize.getWidth();const M=o.margin||40,box=o.box||64,top=o.top||32;const pr=doc.getImageProperties(lg);const sc=Math.min(box/pr.width,box/pr.height);const w=pr.width*sc,hh=pr.height*sc;doc.addImage(lg,(pr.fileType||'JPEG'),pw-M-w,top,w,hh);return top+hh;}catch(e){return 0;}}
function saveReceiptCfg(){const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};state.receipt={name:g('rc_name'),owner:g('rc_owner'),email:g('rc_email'),phone:g('rc_phone'),msg:g('rc_msg'),logo:(state.receipt&&state.receipt.logo)||''};persist();const id=currentDataId();if(id)sbPushDoc(id,'receipt',state.receipt);renderDrawer();toast(t('rc_saved'));}
/* ---------------- sincronización EN VIVO entre dispositivos ---------------- */
let LIVE_TS={},LIVE_BUSY=false;
async function sbLiveSync(){
  if(LIVE_BUSY||SYNC_APPLYING)return;
  const id=currentDataId();if(!id)return;
  if(document.getElementById('device').classList.contains('form-open'))return;   // no interrumpir una edición
  if(document.getElementById('onbo').classList.contains('on'))return;
  LIVE_BUSY=true;
  try{
    const sb=await sbInit();if(!sb){LIVE_BUSY=false;return;}
    const r=await sb.from('store_docs').select('doc_key,updated_at').eq('store_id',id).in('doc_key',['products','clients','sales','mermas','receipt','purchases','porders']);
    if(!r||!r.data){LIVE_BUSY=false;return;}
    const changed=[];
    r.data.forEach(row=>{if(LIVE_TS[row.doc_key]!==row.updated_at){if(LIVE_TS[row.doc_key]!==undefined)changed.push(row.doc_key);LIVE_TS[row.doc_key]=row.updated_at;}});
    if(changed.length){
      SYNC_APPLYING=true;
      for(const k of changed){
        if(sbIsDirty(id,k))continue;   // hay cambios locales sin subir: no sobrescribir
        const d=await sbPullDoc(id,k);
        if(k==='receipt'){if(d&&typeof d==='object'&&!Array.isArray(d))state.receipt=d;continue;}
        if(!Array.isArray(d))continue;
        if(k==='products'){state.products=d;ensureUniqueIds();state.products.forEach(x=>x.unit=canonUnit(x.unit));}
        else if(k==='clients')state.clients=d;
        else if(k==='mermas')state.mermas=d;
        else if(k==='purchases')state.purchases=d;
        else if(k==='porders')state.porders=d;
        else if(k==='sales'){onRemoteSales(d);state.sales=d;idbKvPut('sales:'+id,d);}
      }
      persistLocal();
      SYNC_APPLYING=false;
      if(!document.getElementById('device').classList.contains('form-open'))render();
      if(document.getElementById('histdlg').classList.contains('on'))fillHist();
    }
  }catch(e){SYNC_APPLYING=false;}
  LIVE_BUSY=false;
}
/* ---- Realtime (instantáneo por "señal"): canal de la tienda + broadcast ---- */
let SB_CHAN=null,SB_CHAN_ID=null,SB_SUBBING=false;
async function sbSubscribe(id){
  if(!id||SB_SUBBING)return;
  if(SB_CHAN&&SB_CHAN_ID===id)return;   // ya suscrito y sano
  SB_SUBBING=true;
  try{
    const sb=await sbInit();if(!sb){SB_SUBBING=false;return;}
    if(SB_CHAN){try{sb.removeChannel(SB_CHAN);}catch(e){}SB_CHAN=null;}
    SB_CHAN_ID=id;
    const ch=sb.channel('store:'+id,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'changed'},msg=>{const ks=(msg&&msg.payload&&msg.payload.keys)||['products','sales','clients','mermas'];sbApplyChange(id,ks);});
    ch.subscribe(st=>{
      if(st==='SUBSCRIBED'){SB_CHAN=ch;}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){if(SB_CHAN===ch)SB_CHAN=null;}   // se re-suscribe en el próximo tick
    });
    SB_CHAN=ch;   // optimista; el estado lo corrige si falla
  }catch(e){}
  SB_SUBBING=false;
}
function sbBroadcast(key){try{if(SB_CHAN&&SB_CHAN_ID===currentDataId())SB_CHAN.send({type:'broadcast',event:'changed',payload:{keys:[key]}});}catch(e){}}
async function sbApplyChange(id,keys){
  if(SYNC_APPLYING||id!==currentDataId())return;
  if(document.getElementById('device').classList.contains('form-open'))return;
  try{
    SYNC_APPLYING=true;
    for(const k of keys){
      if(sbIsDirty(id,k))continue;   // hay cambios locales sin subir: no sobrescribir
      const d=await sbPullDoc(id,k);
      if(k==='receipt'){if(d&&typeof d==='object'&&!Array.isArray(d))state.receipt=d;continue;}
      if(!Array.isArray(d))continue;
      if(k==='products'){state.products=d;ensureUniqueIds();state.products.forEach(x=>x.unit=canonUnit(x.unit));LIVE_TS['products']=undefined;}
      else if(k==='clients')state.clients=d;
      else if(k==='mermas')state.mermas=d;
      else if(k==='purchases')state.purchases=d;
      else if(k==='porders')state.porders=d;
      else if(k==='sales'){onRemoteSales(d);state.sales=d;idbKvPut('sales:'+id,d);}
    }
    persistLocal();
    SYNC_APPLYING=false;
    if(!document.getElementById('device').classList.contains('form-open'))render();
    if(document.getElementById('histdlg').classList.contains('on'))fillHist();
  }catch(e){SYNC_APPLYING=false;}
}

function saveDataOf(id,d){_set('data.'+id,d);}

/* notificaciones por entidad */
function loadNotif(id){return _get('notif.'+id,[]);}
function saveNotif(id,l){_set('notif.'+id,l);}
function pushNotif(id,n){
  const item={nid:Date.now()+''+Math.floor(Math.random()*1e4),read:false,...n};
  // Cross-device: when notifying ANOTHER entity, read its current notifs fresh from the db
  // before appending, so we don't overwrite/resurrect its already-seen items from a stale cache.
  if(DBH&&id!==currentDataId()){
    (async()=>{
      let cur=[];
      try{const s=await DBH.doc(_docPath('notif.'+id)).get();const d=s&&s.data&&s.data();if(d&&('v'in d))cur=d.v||[];}catch(_){cur=loadNotif(id);}
      const l=[item,...cur];CACHE['notif.'+id]=l;
      try{localStorage.setItem('abanico.notif.'+id,JSON.stringify(l))}catch(_){}
      try{await DBH.doc(_docPath('notif.'+id)).set({v:l})}catch(_){}
    })();
    return;
  }
  const l=loadNotif(id).slice();l.unshift(item);saveNotif(id,l.slice(0,80));
}
function unreadCount(id){return id?loadNotif(id).filter(n=>!n.read).length:0;}

// Web Audio: una vez "resumido" el contexto con un toque, puede sonar por eventos remotos sin más gestos.
let _sctx=null,_sbuf=null,_sbufTried=false;
function _decodeSale(){
  if(!_sctx||_sbuf||_sbufTried)return;_sbufTried=true;
  try{const b64=SALE_SOUND.split(',')[1];const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    _sctx.decodeAudioData(arr.buffer.slice(0),b=>{_sbuf=b;},()=>{});}catch(_){}
}
function initSaleAudio(){
  if(!isDesktopFmt())return;
  try{if(!_sctx)_sctx=new (window.AudioContext||window.webkitAudioContext)();
    if(_sctx.state==='suspended')_sctx.resume();
    _decodeSale();
  }catch(_){}
}
if(typeof window!=='undefined'){['pointerdown','keydown','click','touchstart'].forEach(ev=>window.addEventListener(ev,initSaleAudio,true));}
function playSaleSound(){
  if(!isDesktopFmt())return;   // solo suena en el escritorio vinculado a la tienda
  try{
    if(!_sctx)initSaleAudio();
    if(_sctx&&_sctx.state==='suspended')_sctx.resume();
    if(_sctx&&_sbuf){const s=_sctx.createBufferSource();s.buffer=_sbuf;const g=_sctx.createGain();g.gain.value=0.95;s.connect(g);g.connect(_sctx.destination);s.start();return;}
    // respaldo: elemento <audio> (por si Web Audio no está listo)
    const a=new Audio(SALE_SOUND);a.volume=0.95;const p=a.play();if(p&&p.catch)p.catch(()=>{});
  }catch(_){}
}
function saleNotify(sale){
  // El dispositivo que vende no se notifica a sí mismo (ya ve "Venta guardada"); los demás
  // dispositivos vinculados reciben la notificación con el resumen vía onRemoteSales.
  playSaleSound();
}

function saleSummary(s){
  let lines=[];
  if(Array.isArray(s.items)&&s.items.length)lines=s.items.map(i=>{const p=P(i.id);const price=i.price!=null?i.price:(p?p.price:0);return {n:p?p.name:'—',q:+i.q||0,p:+price||0};});
  else if(Array.isArray(s.lines))lines=s.lines.map(l=>({n:l.name,q:+l.qty||0,p:+l.price||0}));
  const tot=saleTotal(s);
  return {id:s.id,folio:s.folio||s.id,total:tot,client:s.client||'',pay:s.pay||'',date:s.date||'',time:s.time||'',
    status:(tot-srPaid(s)>0.5)?'cobrar':'pagado',count:lines.reduce((a,l)=>a+l.q,0),lines:lines.slice(0,6),more:Math.max(0,lines.length-6)};
}
// Venta llegada de OTRO dispositivo (misma tienda) → notificación + sonido en el PC vinculado
function onRemoteSales(incoming){
  try{
    if(!Array.isArray(incoming))return;
    const id=currentDataId();if(!id)return;
    const have=new Set((state.sales||[]).map(s=>''+s.id));
    const added=incoming.filter(s=>s&&!have.has(''+s.id));
    if(!added.length)return;
    added.slice(0,5).forEach(s=>{try{pushNotif(id,{kind:'sale',text:ti('n_sale_self',{n:(s.folio||s.id),m:money(saleTotal(s))}),sale:saleSummary(s)});}catch(_){}});
    const bd=document.getElementById('bellDot');if(bd)bd.hidden=false;
    playSaleSound();   // suena solo si es escritorio
  }catch(_){}
}
/* append an item to a shared list doc without clobbering others' entries from a stale cache */
function appendShared(key,item,cap){
  if(DBH){
    (async()=>{
      let cur=[];
      try{const s=await DBH.doc(_docPath(key)).get();const d=s&&s.data&&s.data();if(d&&('v'in d))cur=d.v||[];}catch(_){cur=_get(key,[]);}
      let l=[item,...cur];if(cap&&l.length>cap)l=l.slice(0,cap);
      CACHE[key]=l;try{localStorage.setItem('abanico.'+key,JSON.stringify(l))}catch(_){}
      try{await DBH.doc(_docPath(key)).set({v:l})}catch(_){}
    })();
    return;
  }
  let l=[item,..._get(key,[])];if(cap&&l.length>cap)l=l.slice(0,cap);_set(key,l);
}

async function authSubmit(kind){
  const email=obVal('au_email');const pw=(document.getElementById('au_pass')||{}).value||'';
  if(!email){toast(t('au_need_email'));return;}
  if(!pw){toast(t('au_need_pass'));return;}
  if(pw.length<6){toast(t('au_pass_short'));return;}
  if(kind==='signup'){const pw2=(document.getElementById('au_pass2')||{}).value||'';if(pw!==pw2){toast(t('au_pass_nomatch'));return;}}
  state.onbo.email=email;toast(t('au_working'));
  // "Usuario o correo": si no tiene @, lo convertimos a un correo interno estable
  const loginId=email.includes('@')?email.trim():(email.trim().toLowerCase().replace(/\s+/g,'')+'@abanico.app');
  const r=kind==='signup'?await authSignUp(loginId,pw):await authSignIn(loginId,pw);
  if(r&&r.error){const m=((r.error&&r.error.message)||'').toLowerCase();
    if(m.includes('already')||m.includes('registered'))toast(t('au_exists'));
    else if(m.includes('invalid')||m.includes('credential')||m.includes('email or password'))toast(t('au_bad_creds'));
    else if(m.includes('connection')||m.includes('network')||m.includes('fetch')||m.includes('exception'))toast(t('au_offline'));
    else toast(t('au_err'));
    return;}
  if(kind==='signup'&&r.data&&!r.data.session){toast(t('au_check_email'));state.onbo.mode='signin';return renderOnbo();}
  if(!AUTH)await authGetSession();
  if(!AUTH){toast(t('au_err'));return;}
  try{localStorage.setItem('abanico.authed','1');}catch(_){}
  toast(kind==='signup'?t('au_created'):ti('au_logged',{e:AUTH.email}));

function boot(){
  sbDirtyBoot();   // recupera la cola de cambios pendientes por subir
  const p=safeLocalProfile();
  // No se entra a la app sin sesión: primero validar login
  state.profile=null;
  state.onbo={step:'auth',mode:'signin',tmp:{},email:''};
  document.getElementById('onbo').classList.add('on');renderOnbo();
  migrateInlineImages();
  initDb();
  const authed=(()=>{try{return localStorage.getItem('abanico.authed')==='1';}catch(_){return false;}})();
  authGetSession().then(async session=>{
    if(!session){
      if(authed&&p&&p.id&&!navigator.onLine){enterFromBoot(p);return;} // offline con sesión previa
      renderOnbo();return;
    }
    try{localStorage.setItem('abanico.authed','1');}catch(_){}
    if(p&&p.id)enterFromBoot(p);          // usuario que regresa a su negocio
    else await afterAuth();               // elegir/crear negocio
  }).catch(()=>{
    if(authed&&p&&p.id){enterFromBoot(p);}else renderOnbo();
  });
}

  const pairs=[];Object.keys(base).forEach(c=>base[c].forEach(b=>pairs.push([b,c])));
  const priceRange={'Tornillería':[200,4000],'Adhesivos':[3000,35000],'Abrasivos':[1500,28000],'Seguridad':[3000,60000],'Eléctricos':[2000,90000],'Plomería':[1500,80000],'Pinturas':[8000,120000],'Jardín':[8000,90000],'Cerrajería':[6000,120000],'Herramientas':[9000,250000]};
  const seen=new Set();const items=[];let i=0;
  while(items.length<100){
    const pr=pairs[i%pairs.length];let name=(pr[0]+' '+sizes[i%sizes.length]).trim();
    if(seen.has(name))name=name+' ('+(items.length+1)+')';
    seen.add(name);i++;
    const rng=priceRange[pr[1]]||[1000,50000];
    const price=Math.round((rng[0]+Math.random()*(rng[1]-rng[0]))/100)*100;
    const cost=Math.round(price*(0.55+Math.random()*0.2)/100)*100;
    const stock=Math.floor(5+Math.random()*400);
    items.push({id:items.length+1,key:'FER-'+(1000+items.length),name,cat:pr[1],unit:'u_piece',cost,price,addSale:0,stock,reserve:0,img:null,expiry:null,min:5,max:500,loc:'',lot:''});
  }
  saveDataOf(ID,{products:items,sales:[],cats:[...new Set(items.map(x=>x.cat))],seq:101,extraMoves:[]});
  // demo: ventas de tiendas para poblar Reportes de la bodega
  if(!_get('bsales.'+ID,[]).length){
    const demoT=[['TDA-DEMO1','Tienda La Esquina'],['TDA-DEMO2','Mini Ferre Centro'],['TDA-DEMO3','Depósito El Sur']];
    const led=[];
    demoT.forEach((tt,ti2)=>{const n=6+ti2*4;for(let k=0;k<n;k++){const p=items[Math.floor(Math.random()*items.length)];const q=1+Math.floor(Math.random()*4);led.push({tid:tt[0],tname:tt[1],pid:p.id,name:p.name,qty:q,amount:q*p.price,ts:Date.now()-Math.floor(Math.random()*6e8)});}});
    _set('bsales.'+ID,led);
  }
}
function setReqStatus(reqId,status){
  const l=loadReq();const r=l.find(x=>x.reqId===reqId);if(!r)return;r.status=status;saveReq(l);
  const b=getEntity('bodega',r.bodegaId);
  pushNotif(r.tiendaId,{kind:status==='approved'?'approved':'denied',text:ti(status==='approved'?'n_approved':'n_denied',{b:b?b.name:r.bodegaId})});
  const bl=loadNotif(r.bodegaId);bl.forEach(n=>{if(n.reqId===reqId){n.read=true;n.done=true;}});saveNotif(r.bodegaId,bl);
  render();if(document.getElementById('notifdlg').classList.contains('on'))openNotifs();
  toast(status==='approved'?t('approved_done'):t('rejected_done'));
}
function unlinkTienda(tid){
  const bid=state.profile.id;
  saveReq(loadReq().filter(r=>!(r.bodegaId===bid&&r.tiendaId===tid)));
  pushNotif(tid,{kind:'unlinked',text:ti('n_unlinked',{b:state.profile.name})});
  render();toast(t('unlinked_done'));
}
function unlinkAllTiendas(){
  const bid=state.profile.id;const tids=linkedTiendas(bid);
  saveReq(loadReq().filter(r=>r.bodegaId!==bid));
  tids.forEach(tid=>pushNotif(tid,{kind:'unlinked',text:ti('n_unlinked',{b:state.profile.name})}));
  render();toast(t('unlinked_all_done'));
}
function addFromCatalog(bid,pid){
  const d=loadDataOf(bid);const bp=(d.products||[]).find(p=>p.id===pid);if(!bp)return;
  if(bp.stock<=0){toast(t('no_stock'));return;}
  bp.stock-=1;
  d.dispatches=d.dispatches||[];
  const dl=d.dispatches.find(z=>z.tid===state.profile.id&&z.pid===pid);
  if(dl){dl.qty+=1;dl.name=bp.name;}else d.dispatches.push({tid:state.profile.id,tname:state.profile.name,pid,name:bp.name,qty:1});
  saveDataOf(bid,d);
  let mine=state.products.find(p=>p.origin&&p.origin.bid===bid&&p.origin.pid===pid);
  if(mine)mine.stock+=1;else state.products.push({id:state.seq++,key:bp.key,name:bp.name,cat:bp.cat,unit:bp.unit,cost:bp.price,price:bp.price,addSale:0,stock:1,reserve:0,img:bp.img||null,expiry:null,origin:{bid,pid}});
  persist();pushNotif(bid,{kind:'dispatch',text:ti('n_dispatch',{t:state.profile.name,n:1,p:bp.name})});
  render();toast(t('added_to_inv'));
}
function openNotifs(){
  const id=currentDataId();
  // Purge informational notifs already seen in a previous open; keep pending requests until acted on
  const list=loadNotif(id).filter(n=>!n.read||(n.kind==='request'&&!n.done));saveNotif(id,list);
  document.getElementById('notifH').textContent=t('notifs');
  document.getElementById('notifOptions').innerHTML=list.length?list.map(n=>{
    const act=(n.kind==='request'&&!n.done)?`<div style="display:flex;gap:6px;margin-top:9px"><button class="add-btn" data-act="approve:${n.reqId}">${t('approve')}</button><button class="add-btn" style="border-color:var(--red);color:var(--red)" data-act="deny:${n.reqId}">${t('deny')}</button></div>`:'';
    if(n.kind==='sale'&&n.sale)return notifSaleCard(n);
    return `<div class="notirow ${n.read?'':'unread'}"><div class="ntext">${n.text}</div>${act}</div>`;
  }).join(''):`<div class="empty">${t('no_notifs')}</div>`;
  document.getElementById('notifdlg').classList.add('on','full');
  list.forEach(n=>n.read=true);saveNotif(id,list);
  const bd=document.getElementById('bellDot');if(bd)bd.hidden=true;
}
function closeNotifs(){
  const d=document.getElementById('notifdlg');const wasOpen=d.classList.contains('on');
  d.classList.remove('on','full');
  if(!wasOpen)return;
  const id=currentDataId();if(!id)return;
  // Lo ya visto desaparece al cerrar; se conservan las solicitudes pendientes y lo que llegó sin verse
  saveNotif(id,loadNotif(id).filter(n=>!n.read||(n.kind==='request'&&!n.done)));
  const bd=document.getElementById('bellDot');if(bd)bd.hidden=unreadCount(id)===0;
}
function notifSaleCard(n){
  const s=n.sale||{};const esc=x=>(''+(x==null?'':x)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const st=s.status==='cobrar'?`<span class="ns-badge cobrar">${t('sale_pending')}</span>`:`<span class="ns-badge ok">${t('sale_paid')}</span>`;
  const meta=[s.client?(t('sale_client')+': '+esc(s.client)):'',esc(s.pay)].filter(Boolean).join(' · ');
  const lines=(s.lines||[]).map(l=>`<div class="ns-line"><span class="ns-q num">${l.q}×</span><span class="ns-n">${esc(l.n)}</span><span class="ns-p num">${money((+l.p||0)*(+l.q||0))}</span></div>`).join('');
  return `<div class="notirow nsale ${n.read?'':'unread'}">
    <div class="ns-top"><span class="ns-title">${svg(IC.ventas)} ${ti('ns_sale',{n:esc(s.folio)})}</span><span class="ns-when">${esc([s.date,s.time].filter(Boolean).join(' '))}</span></div>
    <div class="ns-meta">${st}${meta?`<span>${meta}</span>`:''}</div>
    ${lines?`<div class="ns-lines">${lines}</div>`:''}${s.more?`<div class="ns-more">${ti('ns_more',{n:s.more})}</div>`:''}
    <div class="ns-total"><span>${t('total')}${s.count?' · '+ti('ns_units',{n:s.count}):''}</span><b class="num">${money(s.total)}</b></div>
  </div>`;
}

  if(el.id==='txType'){state.txType=el.value;state.txBar=null;state._keep=document.getElementById("screen").scrollTop;return render();}
  if(el.id==='txtType'){state.txtType=el.value;state.txtPt=null;state._keep=document.getElementById("screen").scrollTop;return render();}
  if(el.dataset&&el.dataset.pqty!=null){const id=+el.dataset.pqty;let v=Math.floor(+el.value||0);if(v<0)v=0;if(v===0){delete state.pcart[id];if(state.pcost)delete state.pcost[id];if(state.pprice)delete state.pprice[id];}else state.pcart[id]=v;return render();}
  if(el.dataset&&el.dataset.pcost!=null){const id=+el.dataset.pcost;state.pcost=state.pcost||{};state.pcost[id]=Math.max(0,+el.value||0);return render();}
  if(el.dataset&&el.dataset.pprice!=null){const id=+el.dataset.pprice;state.pprice=state.pprice||{};state.pprice[id]=Math.max(0,+el.value||0);return render();}
  if(el.id==='rc_logo'){const f=el.files&&el.files[0];if(f){const rd=new FileReader();rd.onload=async ev=>{const thumb=await dataUrlToThumb(ev.target.result,256);state.receipt=state.receipt||{};state.receipt.logo=thumb||ev.target.result;persist();{const id=currentDataId();if(id)sbPushDoc(id,'receipt',state.receipt);}renderDrawer();render();toast(t('rc_logo_saved'));};rd.readAsDataURL(f);}return;}
});
// campos de texto de la venta (sin re-render para no perder el foco)
document.getElementById("device").addEventListener("input",e=>{
  const el=e.target;if(!el.id)return;
  if(el.id==='saleClient'){state.saleClient=el.value;updateClientAC();}
  else if(el.id==='saleTag')state.saleTag=el.value;
  else if(el.id==='saleNote')state.saleNote=el.value;
  else if(el.id==='pProvider')state.pprovider=el.value;
  else if(el.id==='pNote')state.pnote=el.value;
});
document.getElementById("ioFile").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(file)handleImportFile(file);});
document.getElementById("bkFile").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(file)bkHandleFile(file);});
document.getElementById("histBody").addEventListener("scroll",()=>{
  const b=document.getElementById("histBody");
  if(b.scrollTop+b.clientHeight>=b.scrollHeight-500&&HIST_LIMIT<state.sales.length){const p=b.scrollTop;HIST_LIMIT+=INV_PAGE;fillHist();b.scrollTop=p;}
},{passive:true});
document.getElementById("screen").addEventListener("scroll",()=>{
  if(state.screen!=='inventario')return;
  const sc=document.getElementById("screen");
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-500&&document.querySelector('.loadmore')){
    state._keep=sc.scrollTop;state.invLimit=(state.invLimit||INV_PAGE)+INV_PAGE;render();
  }
},{passive:true});
boot();
/* ---------------- auto-actualización (recarga al publicar versión nueva) ---------------- */
const APP_VERSION='20260924204823';
function _updBusy(){try{return document.getElementById('device').classList.contains('form-open')||cartItems().length>0||!!document.querySelector('.histdlg.on,.sheetdlg.on,#onbo.on');}catch(e){return false;}}
async function checkAppUpdate(){
  if(APP_VERSION==='20260924204823')return;   // en local no hay version.txt
  try{
    const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    if(v&&v!==APP_VERSION){
      if(_updBusy())return;              // no interrumpir una venta/edición en curso; reintenta luego
      try{toast(t('app_updating'));}catch(e){}
      setTimeout(()=>location.reload(),700);
    }
  }catch(e){}
}
setInterval(checkAppUpdate,45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAppUpdate();});
window.addEventListener('focus',checkAppUpdate);
/* instalar como app / pantalla completa (PWA) */
let DEFERRED_INSTALL=null;
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){return false;}}
function refreshInstallBtn(){const b=document.getElementById('installBtn');if(!b)return;const lb=document.getElementById('installLbl');if(lb)lb.textContent=t('m_install');b.hidden=isStandalone();}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED_INSTALL=e;refreshInstallBtn();});
window.addEventListener('appinstalled',()=>{DEFERRED_INSTALL=null;const b=document.getElementById('installBtn');if(b)b.hidden=true;});
async function doInstall(){
  drawer(false);
  if(DEFERRED_INSTALL){try{DEFERRED_INSTALL.prompt();await DEFERRED_INSTALL.userChoice;}catch(e){}DEFERRED_INSTALL=null;return;}
  toast(t('install_ios'));   // iOS/Safari: no hay prompt programático
}
refreshInstallBtn();
/* sincronización de datos: instantánea por Realtime (broadcast). Cada 20s se auto-repara la suscripción y se hace un chequeo ligero de respaldo; también al volver a la app. */
setInterval(()=>{const id=currentDataId();if(id){if(!SB_CHAN||SB_CHAN_ID!==id)sbSubscribe(id);sbLiveSync();}},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sbSubscribe(currentDataId());sbLiveSync();}});
window.addEventListener('focus',()=>{sbSubscribe(currentDataId());sbLiveSync();});
</script>
