/* ---------------- Preguntas de la app (en vez de confirm/prompt del navegador) ----------------
   El navegador antepone "fabiandres55.github.io dice". Esta ventana muestra solo la pregunta, como Mi Negocio:
   NO / SÍ, o CANCELAR / ACEPTAR cuando hay que escribir algo. Tocar fuera, Esc o el gesto atrás = NO. */
let ASK_DONE=null,ASK_INPUT=false;
function askEl(){
  let d=document.getElementById('askdlg');if(d)return d;
  d=document.createElement('div');d.className='permdlg askdlg';d.id='askdlg';
  d.innerHTML='<div class="askcard" role="alertdialog" aria-modal="true"><div class="askmsg"></div><input class="inp askin" autocomplete="off"><div class="askmenu" hidden></div><div class="askbtns"><button type="button" data-ask="no"></button><button type="button" data-ask="yes"></button></div></div>';
  (document.getElementById('device')||document.body).appendChild(d);
  d.addEventListener('click',e=>{const mb=e.target.closest('[data-askmenu]');if(mb){askFinish(+mb.dataset.askmenu);return;}const b=e.target.closest('[data-ask]');if(b)askAnswer(b.dataset.ask==='yes');else if(e.target===d)askAnswer(false);});
  d.addEventListener('keydown',e=>{if(e.key==='Enter'&&ASK_INPUT){e.preventDefault();askAnswer(true);}else if(e.key==='Escape')askAnswer(false);});
  return d;
}
askEl();   // existe desde el inicio para que el historial (gesto atrás) la cuente como ventana
let ASK_MENU=false;
function askFinish(v){if(!ASK_DONE)return;const d=askEl();const done=ASK_DONE;ASK_DONE=null;d.classList.remove('on');done(v);}
function askAnswer(yes){
  if(!ASK_DONE)return;const d=askEl();
  if(ASK_MENU){askFinish(-1);return;}   // menú: tocar fuera o atrás = ninguna opción
  askFinish(yes?(ASK_INPUT?d.querySelector('.askin').value:true):(ASK_INPUT?null:false));
}
function askOpen(msg,input,val,alertOnly,type){
  if(ASK_DONE)askAnswer(false);
  const d=askEl();ASK_INPUT=!!input;ASK_MENU=false;d.querySelector('.askmenu').hidden=true;d.querySelector('.askbtns').hidden=false;d.querySelector('[data-ask="no"]').hidden=!!alertOnly;
  d.querySelector('.askmsg').textContent=msg;const inp=d.querySelector('.askin');inp.hidden=!input;inp.type=type||'text';inp.inputMode=type==='number'?'numeric':'';inp.value=val||'';
  d.querySelector('[data-ask="no"]').textContent=t(input?'ask_cancel':'ask_no');d.querySelector('[data-ask="yes"]').textContent=t(input||alertOnly?'ask_ok':'ask_yes');
  return new Promise(res=>{ASK_DONE=res;d.classList.add('on');setTimeout(()=>{try{if(input){inp.focus();inp.select();}else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(_){}},60);});
}
function appConfirm(msg){return askOpen(msg,false);}
function appConfirmL(msg,noLbl,yesLbl){const p=askOpen(msg,false);const d=askEl();d.querySelector('[data-ask="no"]').textContent=noLbl;d.querySelector('[data-ask="yes"]').textContent=yesLbl;return p;}
function appAlert(msg){return askOpen(msg,false,'',true);}   // solo ACEPTAR
// Menú de opciones (⋮): devuelve el número de la opción o -1
function appMenu(title,labels){
  if(ASK_DONE)askAnswer(false);
  const d=askEl();ASK_INPUT=false;ASK_MENU=true;d.querySelector('.askmsg').textContent=title;d.querySelector('.askin').hidden=true;d.querySelector('.askbtns').hidden=true;
  const m=d.querySelector('.askmenu');m.hidden=false;m.innerHTML=labels.map((l,i)=>`<button type="button" data-askmenu="${i}">${exEsc(l)}</button>`).join('');
  return new Promise(res=>{ASK_DONE=res;d.classList.add('on');});
}          // → true / false
function appPrompt(msg,val,type){return askOpen(msg,true,val,false,type);}    // → texto / null

function imgRotate(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalHeight;c.height=im.naturalWidth;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);res(c.toDataURL('image/jpeg',.92));};im.onerror=()=>res(null);im.src=src;});}
async function pdRotate(){const p=pdP();if(!p)return;const src=pdImgSrc(p);if(!src){toast(t('pd_noimg'));return;}const r=await imgRotate(src);if(r)pdStoreImage(p,r);}

const QR_LIB='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
async function qrLib(){if(!window.qrcode)await sbScript(QR_LIB);if(window.qrcode&&qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];return window.qrcode||null;}
function qrMake(text){const q=qrcode(0,'M');q.addData(''+text);q.make();return q;}
function qrCanvas(q,cell,margin){const n=q.getModuleCount();const s=(n+margin*2)*cell;const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,s,s);x.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+margin)*cell,(r+margin)*cell,cell,cell);return c;}

  try{if(!await qrLib()){toast(t('io_err'));return;}}catch(_){toast(t('io_err'));return;}
  QR_CUR={key,url:qrCanvas(qrMake(key),8,2).toDataURL('image/png')};
  document.getElementById('qrcard').innerHTML=`<img class="qr-img" src="${QR_CUR.url}" alt="QR"><div class="qr-k">${exEsc(key)}</div><button class="pd-ib qr-share" data-act="qrshare" aria-label="${t('qr_share')}">${svg(ICO_SHARE)}</button>`;

// PDF con el QR de cada producto elegido (12 por hoja: QR, clave y nombre)
async function massQRPdf(ids){
  const list=ids.map(id=>P(id)).filter(p=>p&&(''+(p.key||'')).trim()).sort(prodCmp);
  if(!list.length){toast(t('mass_none'));return false;}
  toast(t('cx_generating'));
  try{
    if(!await qrLib())throw 0;
    if(!(window.jspdf&&window.jspdf.jsPDF))await sbScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const JS=window.jspdf&&window.jspdf.jsPDF;if(!JS)throw 0;
    const doc=new JS({unit:'pt',format:'a4'});
    const W=595.28,H=841.89,M=36,cols=3,rows=4,cw=(W-2*M)/cols,ch=(H-2*M)/rows,qs=Math.min(cw,ch)-62;
    list.forEach((p,i)=>{
      const k=i%(cols*rows);if(i&&!k)doc.addPage();
      const cx=M+(k%cols)*cw,cy=M+Math.floor(k/cols)*ch,key=(''+p.key).trim();
      doc.addImage(qrCanvas(qrMake(key),4,1).toDataURL('image/png'),'PNG',cx+(cw-qs)/2,cy+8,qs,qs);
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(20);
      doc.text(doc.splitTextToSize(key,cw-12)[0],cx+cw/2,cy+qs+24,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(70);
      doc.text(doc.splitTextToSize((''+(p.name||'')).replace(/^\.{3}\s*/,''),cw-12).slice(0,2),cx+cw/2,cy+qs+37,{align:'center'});
    });
    const ok=await saveWithPicker(t('qr_file')+' '+todayISO()+'.pdf','application/pdf',doc.output('blob'));
    if(ok)toast(t('io_done_exp'));return ok;
  }catch(_){toast(t('io_err'));return false;}
}

/* ---------------- Gesto/botón "atrás" de Android ----------------
   La app instalada cerraba al ir "atrás" (no había historial) y se perdía el pedido en curso.
   Cada paso (otra pantalla, abrir una ventana o el menú) crea su propia entrada en el historial con el estado al que
   lleva, y "atrás" vuelve al estado de la entrada anterior: la pantalla donde estaba (con su posición y búsqueda) o la
   misma pantalla sin la ventana. Así la vista previa del gesto de Chrome (la captura de la entrada anterior) coincide
   con lo que aparece al soltar; antes las entradas eran genéricas y se veía otra pantalla un instante.
   En la pantalla principal "atrás" no hace nada: la app se minimiza deslizando (inicio) y se cierra desde recientes.
   Entradas de guarda al fondo: se crean SOLO tras un toque real (Chrome salta las creadas sin interacción). */
/* Android con Chrome: el gesto atrás se atrapa con CloseWatcher y el historial de la app vive en memoria (VNAV).
   El historial real del navegador queda con una sola entrada, así "¿Salir de la aplicación?" → ACEPTAR puede cerrar la app
   (Chrome solo deja cerrar con window.close una ventana sin historial). En otros navegadores sigue el historial real. */
const NAV_VIRTUAL=(()=>{try{return typeof CloseWatcher==='function'&&/Android/i.test(navigator.userAgent);}catch(_){return false;}})();
const VNAV={E:[null],i:0,
  get state(){return this.E[this.i];},get length(){return this.E.length;},
  pushState(st){this.E=this.E.slice(0,this.i+1);this.E.push(st);this.i++;},
  replaceState(st){this.E[this.i]=st;},
  go(n){n=n|0;const j=this.i+n;if(!n||j<0||j>=this.E.length)return;this.i=j;const st=this.E[j];setTimeout(()=>navPop({state:st}),0);},
  back(){this.go(-1);},forward(){this.go(1);}};
const NAVH=NAV_VIRTUAL?VNAV:history;
let NAV_CW=null;
function cwArm(){if(!NAV_VIRTUAL||NAV_CW||NAV_EXITING)return;try{NAV_CW=new CloseWatcher();NAV_CW.onclose=()=>{NAV_CW=null;cwBack();setTimeout(cwArm,0);};}catch(_){NAV_CW=null;}}
function cwBack(){if(NAV_EXITING)return;if(VNAV.i>0)VNAV.go(-1);else navPop({state:VNAV.state});}
const BACK_GUARDS=3;let BACK_RELOADING=false;let NAV_RESTORING=false;const NAV_LOG=[];let NAV_Q='',NAV_LIM=0;
function backDepth(){const st=NAVH.state;return (st&&st.abBack)||0;}
// estado visible: pantalla, tienda y capas abiertas (de abajo hacia arriba)
// Secciones principales (las del menú): ahí "atrás" pregunta si salir, como Mi Negocio
function isTopScreen(sc){
  if(sc==='nueva')return !state.editSale&&!state.quoteMode;   // Ventas (no al editar ni cotizar)
  if(sc==='compras'&&state.poMode)return false;
  return currentDrawer().some(d=>d.id===sc&&!d.sep&&!d.soon);
}
let NAV_EXITING=false;
async function askExit(){
  const ok=await appConfirmL(t('exit_q'),t('ask_cancel'),t('ask_ok'));
  if(ok)return exitApp();
  try{navPush({...navCur(),g:1});}catch(_){}   // se queda: vuelve a tener una entrada de guarda (el toque da permiso)
}
// Salir: la app instalada se cierra; en el navegador vuelve a la página anterior
function exitApp(){
  NAV_EXITING=true;
  if(NAV_CW){try{NAV_CW.destroy();}catch(_){}NAV_CW=null;}
  try{window.close();}catch(_){}   /* la app instalada se cierra */
  setTimeout(()=>{
    if(!document.hidden){   /* no se pudo cerrar (pestaña del navegador): vuelve a la página anterior */
      if(NAV_VIRTUAL){try{history.back();}catch(_){}}
      else{const d=backDepth();try{if(d>0){history.go(-d);setTimeout(()=>{try{history.back();}catch(_){}},400);}else history.back();}catch(_){}}
    }
    setTimeout(()=>{NAV_EXITING=false;cwArm();},1500);
  },300);
}
// Después de cambiar entre secciones principales: una entrada de guarda tomada con la sección ya dibujada
// (así la vista previa del gesto de Chrome muestra la misma sección y no otra)
function navGuardSoon(){setTimeout(()=>{try{if(navSame(navCur(),NAVH.state))navPush({...navCur(),g:1});}catch(_){}},150);}   // 150 ms: la sección ya está pintada (requestAnimationFrame se detiene si la app no está visible)
function navLayers(){
  const dev=document.getElementById('device');const L=[];if(dev.classList.contains('drawer-open'))L.push('drawer');
  const list=[...document.querySelectorAll('.histdlg.on,.sheetdlg.on,.permdlg.on')];if(dev.classList.contains('form-open'))list.push(document.getElementById('formscreen'));
  return L.concat(layerSort(list).reverse().map(e=>e.id));
}
function navCur(){return {s:state.screen,p:(state.profile&&state.profile.id)||'',L:navLayers()};}
function navSame(a,b){return !!(a&&b)&&a.s===b.s&&(a.p||'')===(b.p||'')&&(a.L||[]).join()===(b.L||[]).join();}
function navPush(o){NAV_SKIP_POP=0;const d=backDepth()+1;const st={...o,abBack:d};NAVH.pushState(st,'');NAV_LOG[d]=st;NAV_LOG.length=d+1;}
function navReplace(o){const d=backDepth();const st={...o,abBack:d};NAVH.replaceState(st,'');NAV_LOG[d]=st;}
function backTopUp(e){if(e&&e.isTrusted===false)return;cwArm();if(BACK_RELOADING)return;try{for(let i=0;i<BACK_GUARDS&&backDepth()<BACK_GUARDS;i++)navPush({...navCur(),g:1});}catch(_){}}
['click','pointerup','touchend','keydown'].forEach(ev=>window.addEventListener(ev,backTopUp,{capture:true,passive:true}));
// Registra cada paso visible en el historial (al dibujar y al abrir/cerrar ventanas o el menú).
// leave: posición y búsqueda de la pantalla que se deja (la pantalla ya cambió cuando se llama desde render)
function navSync(leave){
  try{
    if(NAV_RESTORING||BACK_RELOADING)return;
    if(document.getElementById('onbo').classList.contains('on'))return;
    const cur=navCur();const st=NAVH.state;
    if(!st||st.s==null){navReplace({...(st||{}),...cur});return;}   // primera entrada (al abrir): solo se etiqueta
    if(navSame(cur,st))return;
    const sl=st.L||[];const kept=sl.filter(x=>cur.L.includes(x));const closed=kept.length<sl.length;
    const moved=cur.s!==st.s||cur.p!==(st.p||'');
    if(closed&&moved){navReplace({...cur,g:st.g});if(isTopScreen(cur.s))navGuardSoon();return;}   // la ventana o el menú llevó a otra pantalla: es el mismo paso
    if(moved&&!closed&&isTopScreen(cur.s)&&(st.s==null||isTopScreen(st.s))){navReplace({...cur});navGuardSoon();return;}   // de una sección principal a otra (como Mi Negocio: no se apilan)
    if(closed){navReplace({...st,L:kept});if(navSame(cur,NAVH.state))return;}   // se cerró con su X o al guardar
    const sc=document.getElementById('screen');
    const lv=(moved&&leave)?leave:{y:sc?sc.scrollTop:0,q:state.q,lim:state.invLimit};
    NAVH.replaceState({...NAVH.state,y:lv.y,q:lv.q,lim:lv.lim},'');NAV_LOG[backDepth()]=NAVH.state;
    navPush(cur);
  }catch(_){}
}
// Vuelve al estado de una entrada: cierra las ventanas que sobran y cambia de pantalla (nunca abre ventanas).
// Devuelve false si el usuario prefirió quedarse (no quiso descartar cambios).
function navRestore(tg){
  const want=tg.L||[];
  const closeExtra=()=>{for(let i=0;i<15;i++){const top=topLayer();if(!top||want.includes(top.id))return true;const fn=BACK_CLOSE[top.id];if(fn)fn();else top.classList.remove('on');if(topLayer()===top)return false;}return true;};
  if(!closeExtra())return false;
  if(document.getElementById('device').classList.contains('drawer-open')&&!want.includes('drawer'))drawer(false);
  const pid=(state.profile&&state.profile.id)||'';
  if(tg.s&&tg.s!==state.screen&&SCREENS[tg.s]&&(tg.p||'')===pid&&!topLayer()){
    const br=document.querySelector('#body .backrow[data-act]');   // modo en curso (editar venta, cotización, pedido): se sale como con su flecha
    if(br){const act=br.dataset.act;br.click();
      const still=document.querySelector('#body .backrow[data-act]');if(still&&still.dataset.act===act)return false;   // no quiso descartar los cambios: se queda
      if(!closeExtra())return false;}   // salir del modo puede reabrir ventanas (detalle de la venta): se vuelve al estado de la entrada
    if(state.screen!==tg.s&&!topLayer()){
      go(tg.s);
      if(state.screen===tg.s){   // donde estaba: búsqueda, cuántos productos cargados y posición
        let re=false;if(tg.q!=null&&tg.q!==state.q){state.q=tg.q;re=true;}if(tg.lim>(state.invLimit||0)){state.invLimit=tg.lim;re=true;}
        if(re){state._keep=0;render();}
        const sc=document.getElementById('screen');if(sc&&tg.y)sc.scrollTop=tg.y;
      }
    }
  }
}
// La flecha "atrás" de la pantalla: si la entrada anterior es esa pantalla, se vuelve por el historial (no se apila otra)
function navBackTo(scr){
  if(NAV_RESTORING)return false;
  const d=backDepth();const st=NAVH.state;if(!(d>0&&st&&st.s===state.screen&&!(st.L||[]).length))return false;
  let j=d-1;while(j>0&&NAV_LOG[j]&&NAV_LOG[j].s===state.screen&&!(NAV_LOG[j].L||[]).length)j--;   // entradas iguales a la actual
  const prev=NAV_LOG[j];if(prev&&prev.s===scr){NAVH.go(j-d);return true;}
  return false;
}
// Al entrar a la app se quitan los campos del login: así Chrome no confunde los buscadores con el usuario
function initAuthCleanup(){
  const o=document.getElementById('onbo');if(!o)return;
  const clean=()=>{if(o.classList.contains('on'))return;const b=document.getElementById('onboBody');if(b&&b.querySelector('input'))b.innerHTML='';};
  new MutationObserver(clean).observe(o,{attributes:true,attributeFilter:['class']});clean();
}
setTimeout(initAuthCleanup,0);
document.addEventListener('submit',e=>e.preventDefault(),true);   // el login usa su botón; el formulario nunca recarga la página
function initNav(){
  const mo=new MutationObserver(()=>navSync());
  document.querySelectorAll('.histdlg,.sheetdlg,.permdlg').forEach(d=>mo.observe(d,{attributes:true,attributeFilter:['class']}));
  mo.observe(document.getElementById('device'),{attributes:true,attributeFilter:['class']});
  if(NAVH.state)NAV_LOG[backDepth()]=NAVH.state;
  cwArm();
}
setTimeout(initNav,0);
// Recargar sin dejar entradas viejas en el historial (si no, "atrás" recargaría la app)
function appReload(){const d=backDepth();if(d>0){BACK_RELOADING=true;try{NAVH.go(-d);}catch(_){location.reload();return;}setTimeout(()=>location.reload(),900);}else location.reload();}
// La capa abierta que está encima (mayor z-index; a igual z-index, la última en el HTML)
function layerSort(list){return list.sort((a,b)=>{const za=parseInt(getComputedStyle(a).zIndex)||0,zb=parseInt(getComputedStyle(b).zIndex)||0;if(za!==zb)return zb-za;return (a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING)?1:-1;});}   // de arriba hacia abajo
function topLayer(){
  const list=[...document.querySelectorAll('.histdlg.on,.sheetdlg.on,.permdlg.on')];
  if(document.getElementById('device').classList.contains('form-open'))list.push(document.getElementById('formscreen'));
  if(!list.length)return null;
  return layerSort(list)[0];
}
// Cada ventana se cierra igual que con su X
const BACK_CLOSE={askdlg:()=>askAnswer(false),itemsdlg:()=>closeItemsEdit(false),schedlg:()=>closeSched(false),permdlg:()=>permResult(false),sharedlg:()=>closeShareRecibo(),pinfodlg:()=>closePInfo(),exdlg:()=>closeExForm(),provdlg:()=>closeProvForm(),svcdlg:()=>closeSvcForm(),evdlg:()=>closeEv(),quotedlg:()=>{state.poOpen=null;closeQuote();},cfgdlg:()=>{closeCfgDlg();PIN_NEXT=null;},svcpickdlg:()=>closeSvcPick(),pctdlg:()=>closePct(),provpickdlg:()=>closeProvPick(),empdlg:()=>closeEmp(),excatdlg:()=>closeExCat(),exfltdlg:()=>closeExFlt(),plistdlg:()=>closePriceList(),xpdlg:()=>closeXp(),paydlg:()=>closePay(),unitdlg:()=>closeUnit(),catpickdlg:()=>closeCatPick(),catmenudlg:()=>closeCatMenu(),
  mermapickdlg:()=>closeMermaPick(),mermaadddlg:()=>closeMermaAdd(),mermadlg:()=>closeMerma(),scandlg:()=>closeScanner(),saleproddlg:()=>closeSaleProd(),clidlg:()=>closeCli(),
  saledlg:()=>closeSale(),rsvdlg:()=>closeReserva(),notifdlg:()=>closeNotifs(),iodlg:()=>closeIO(),catdlg:()=>closeCat(),filterdlg:()=>closeFilter(),catalogdlg:()=>closeCatalog(),
  histdlg:()=>closeHist(),formscreen:()=>closeForm(),pdetdlg:()=>closePDet(),pfdlg:()=>closePF(),qrdlg:()=>closeQR(),invoptdlg:()=>closeInvOpts(),massdlg:()=>{closeMass();MASS=null;},massprdlg:()=>closeMassPrice()};
function appBack(){
  if(document.getElementById('onbo').classList.contains('on')){   // login / alta: paso anterior
    const st=state.onbo&&state.onbo.step;const prev={created:'create',create:'role',role:(state.onbo.stores&&state.onbo.stores.length)?'stores':null}[st];
    if(prev)obGo(prev);else if(NAV_VIRTUAL)exitApp();return;   /* primer paso del inicio de sesión: atrás sale */
  }
  const top=topLayer();
  if(top){const fn=BACK_CLOSE[top.id];if(fn)fn();else top.classList.remove('on');return;}
  if(document.getElementById('device').classList.contains('drawer-open')){drawer(false);return;}
  const br=document.querySelector('#body .backrow[data-nav],#body .backrow[data-act]');   // la flecha "atrás" de la pantalla
  if(br){br.click();return;}
  if(state.profile&&state.screen!=='inventario'){go('inventario');return;}
  // pantalla principal: no cerrar la app
}
let NAV_SKIP_POP=0;
window.addEventListener('popstate',e=>{if(NAV_VIRTUAL)return;navPop(e);});
function navPop(e){
  if(BACK_RELOADING){location.reload();return;}
  if(NAV_SKIP_POP&&Date.now()-NAV_SKIP_POP<1500){NAV_SKIP_POP=0;return;}   // regreso a la entrada actual tras quedarse
  NAV_SKIP_POP=0;
  const tg=e.state;if(tg&&tg.abBack!=null)NAV_LOG[tg.abBack]=tg;
  const onbo=()=>document.getElementById('onbo').classList.contains('on');
  if(NAV_EXITING)return;
  if(!onbo()&&isTopScreen(state.screen)&&!navLayers().length){   // como Mi Negocio: en una sección principal, atrás pregunta "¿Salir de la aplicación?"
    try{navReplace({...navCur(),g:1});}catch(_){}
    if(!ASK_DONE)askExit();return;
  }
  NAV_RESTORING=true;let again=false,stay=false;
  try{
    if(onbo())appBack();
    else{
      const before=navCur();
      stay=tg&&tg.s!=null&&navRestore(tg)===false;
      if(!stay&&navSame(before,navCur())){
        if(tg&&tg.s!=null&&!tg.g&&tg.abBack>0)again=true;   // entrada repetida (una ventana que se cerró con su X): un paso más
        else appBack();   // fondo del historial: cierra lo abierto o va a la pantalla principal
      }
    }
  }catch(_){}
  NAV_RESTORING=false;
  if(stay){NAV_SKIP_POP=Date.now();NAVH.forward();return;}   // se quedó (no descartó cambios): el historial vuelve a la entrada actual
  try{const cur=navCur();if(!onbo()&&!navSame(cur,NAVH.state))navReplace({...(NAVH.state||{}),...cur});}catch(_){}
  if(again)NAVH.back();
}

/* ---------------- Pedido en curso guardado en el dispositivo ----------------
   Si Android cierra la app (atrás, falta de memoria, recientes), al volver a abrir la tienda el pedido
   sigue ahí. Uno por tienda; se borra al cobrar/guardar o al cancelar el pedido. */
function cartDraftKey(id){return 'abanico.cartdraft.'+id;}
let _draftLast=null;
function saveCartDraft(){
  const id=currentDataId();if(!id||state.editSale||state.quoteMode||state.poMode)return;
  let v='';
  if(saleHas()||pcartItems().length)v=JSON.stringify({cartAt:state.cartAt||{},saleAddr:state.saleAddr||'',scart:state.scart||{},scPrice:state.scPrice||{},scName:state.scName||{},cartAdj:state.cartAdj||{},cart:state.cart,cartPrice:state.cartPrice||{},saleClient:state.saleClient||'',salePay:state.salePay||'',saleTag:state.saleTag||'',saleNote:state.saleNote||'',saleStatus:state.saleStatus||'pagado',
    pcart:state.pcart||{},pcost:state.pcost||{},pprice:state.pprice||{},pprovider:state.pprovider||'',pnote:state.pnote||'',pstatus:state.pstatus||'pagado'});
  const k=id+'|'+v;if(k===_draftLast)return;_draftLast=k;
  try{if(v)localStorage.setItem(cartDraftKey(id),v);else localStorage.removeItem(cartDraftKey(id));}catch(_){}
}
// Devuelve 'sale' / 'purchase' si recuperó un pedido (se llama justo después de loadData)
function restoreCartDraft(id){
  let d=null;try{d=JSON.parse(localStorage.getItem(cartDraftKey(id))||'null');}catch(_){}
  if(!d)return null;
  const n=o=>Object.values(o||{}).filter(q=>+q>0).length;const ns=n(d.cart)+n(d.scart),np=n(d.pcart);
  if(!ns&&!np)return null;
  state.cart=d.cart||{};state.cartAt=d.cartAt||{};state.cartPrice=d.cartPrice||{};state.scart=d.scart||{};state.scPrice=d.scPrice||{};state.scName=d.scName||{};state.cartAdj=d.cartAdj||{};state.saleAddr=d.saleAddr||'';state.saleClient=d.saleClient||'';state.salePay=d.salePay||'';state.saleTag=d.saleTag||'';state.saleNote=d.saleNote||'';state.saleStatus=d.saleStatus||'pagado';
  state.pcart=d.pcart||{};state.pcost=d.pcost||{};state.pprice=d.pprice||{};state.pprovider=d.pprovider||'';state.pnote=d.pnote||'';state.pstatus=d.pstatus||'pagado';
  return ns?'sale':'purchase';
}
function draftToast(kind){if(!kind)return;try{toast(kind==='sale'?ti('draft_sale',{n:cartItems().reduce((a,i)=>a+i.q,0)}):t('draft_purchase'));}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)try{saveCartDraft();}catch(_){}});

/* ---------------- auto-actualización (recarga al publicar versión nueva) ---------------- */
const APP_VERSION='20261003210023';
function _updBusy(){try{return !!state.bkLoading||document.getElementById('device').classList.contains('form-open')||saleHas()||!!document.querySelector('.histdlg.on,.sheetdlg.on,#onbo.on');}catch(e){return false;}}
async function checkAppUpdate(){
  if(APP_VERSION==='__BUILD__')return;   // en local no hay version.txt
  try{
    const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    if(v&&v!==APP_VERSION){
      if(_updBusy())return;              // no interrumpir una venta/edición en curso; reintenta luego
      try{toast(t('app_updating'));}catch(e){}
      setTimeout(()=>appReload(),700);
    }
  }catch(e){}
}
setInterval(checkAppUpdate,45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAppUpdate();});
window.addEventListener('focus',checkAppUpdate);
