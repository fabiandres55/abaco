<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#565b60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ábaco">
<meta name="application-name" content="Ábaco">
<title>Abanico · Bodega y Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
  :root{
    --pri:#6f757a;--pri-d:#565b60;--pri-l:#828990;--fab:#5f656a;
    --ink:#20232a;--muted:#6c7177;--faint:#9aa0a6;--line:#e6e7ea;--line2:#f0f1f3;
    --bg:#f3f4f5;--card:#ffffff;--sel:#eceef0;--green:#2e7d4f;--red:#c8452f;--amber:#b07414;
    --ui:"Roboto",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:var(--ui);color:var(--ink);background:linear-gradient(160deg,#3a3d42,#181a1d);
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .device{position:relative;width:100%;max-width:412px;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  @media (max-width:479px){body{align-items:flex-start}}
  @media (min-width:480px){.device{height:min(880px,94vh);max-height:94vh;border-radius:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);border:1px solid #000}}

  .statusbar{flex:none;height:26px;background:var(--pri-d);color:#eceef0;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:500;gap:6px}
  .statusbar .sb-r{margin-left:auto;display:flex;align-items:center;gap:6px}
  .statusbar svg{width:14px;height:14px;fill:#eceef0}

  .appbar{flex:none;background:var(--pri);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;height:56px;box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;z-index:6}
  .iconbtn{width:44px;height:44px;border:none;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:50%}
  .iconbtn:active{background:rgba(255,255,255,.15)}
  .iconbtn svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .appbar .title{margin-left:4px;flex:1;min-width:0;line-height:1.15}
  .appbar .title .t1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .title .t2{font-size:12.5px;color:#e6e8ea;font-weight:400}
  .badge-dot{position:absolute;top:11px;right:9px;width:7px;height:7px;background:var(--red);border-radius:50%}

  .invhead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .isearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
  .isearch svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9;flex:none}
  .isearch input{border:none;outline:none;background:transparent;font-family:var(--ui);font-size:14px;width:100%;color:var(--ink);min-width:0}
  .isearch .clr{color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;flex:none}
  .round{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none}
  .round svg{width:20px;height:20px;stroke:var(--pri-d);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer}
  .fchip svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .fchip.act{background:var(--pri);color:#fff;border-color:var(--pri)}
  .fchip.act svg{stroke:#fff}
  .pcards{display:flex;flex-direction:column;gap:11px}
  .pcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px 14px;cursor:pointer}
  .pcard:active{background:var(--sel)}
  .pc-top{display:flex;align-items:center;gap:13px}
  .pc-img{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--sel);flex:none;overflow:hidden;display:grid;place-items:center}
  .pc-img img{width:100%;height:100%;object-fit:cover}
  .pc-img svg{width:28px;height:28px;stroke:var(--faint);fill:none;stroke-width:1.6}
  .pc-id{flex:1;min-width:0}
  .pc-key{font-size:18px;font-weight:600;color:#3b4046;line-height:1.2;word-break:break-word}
  .pc-name{font-size:14.5px;color:var(--muted);margin-top:1px}
  .pc-warn{flex:none;align-self:flex-start}.pc-warn svg{width:26px;height:26px}
  .pc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
  .pc-m{text-align:center}.pc-ml{font-size:13px;color:var(--muted)}.pc-mv{font-size:22px;font-weight:700;margin-top:3px}.pc-mv.warnv{color:var(--red)}
  .sheetdlg{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:16;display:none;align-items:flex-end}
  .sheetdlg.on{display:flex}
  .sheetcard{background:var(--card);width:100%;border-radius:16px 16px 0 0;max-height:72%;display:flex;flex-direction:column;padding-bottom:10px;box-shadow:0 -8px 30px -10px rgba(0,0,0,.4)}
  .sheet-h{padding:16px 18px 12px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line2)}
  .sheet-list{overflow-y:auto;padding:4px 0}
  .catopt{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;font-size:15px;color:var(--ink)}
  .catopt:active{background:var(--sel)}.catopt.sel{color:var(--pri-d);font-weight:600}
  .catopt .ck{width:20px;height:20px;flex:none}.catopt .ck svg{width:20px;height:20px;stroke:var(--pri-d);fill:none;stroke-width:2.2}

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
  .pad{padding:12px 12px 90px}

  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
  .kpi .k-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
  .kpi .k-v{font-size:17px;font-weight:700;margin-top:4px}
  .kpi.hero{grid-column:1/-1;background:var(--pri);color:#fff;border-color:var(--pri)}
  .kpi.hero .k-l{color:#e2e4e6}.kpi.hero .k-v{font-size:29px;color:#fff}
  .kpi .k-sub{font-size:11px;color:var(--muted);margin-top:2px}

  .btn{font-family:var(--ui);font-weight:500;font-size:15px;border:none;border-radius:8px;padding:13px;width:100%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
  .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);text-transform:none;font-weight:500}
  .btn.dark{background:var(--ink);color:#fff}
  .btn:active{opacity:.9}

  .section-h{display:flex;align-items:center;margin:18px 3px 9px}
  .section-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0}
  .section-h a{margin-left:auto;font-size:12.5px;color:var(--pri-d);font-weight:500;text-decoration:none}

  .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row .av{width:36px;height:36px;border-radius:8px;background:var(--sel);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--pri-d);flex:none;overflow:hidden}
  .row .av img{width:100%;height:100%;object-fit:cover}
  .row .av svg{width:18px;height:18px;stroke:var(--pri-d);fill:none;stroke-width:2}
  .row .t{font-size:14px;font-weight:500;line-height:1.2}
  .row .s{font-size:12px;color:var(--muted);margin-top:2px}
  .row .r{margin-left:auto;text-align:right}
  .row .amt{font-weight:700;font-size:14px}.row .r .s{margin-top:2px}
  .chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:100px;border:1px solid var(--line);color:var(--muted)}
  .chip.low{color:var(--red);border-color:#eec6be;background:#fbeeeb}
  .chip.ok{color:var(--green);border-color:#c4e2ce;background:#eef7f1}

  .search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--card)}
  .search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .search input{border:none;outline:none;font-family:var(--ui);font-size:14px;width:100%;background:transparent;color:var(--ink)}
  .pick{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line2)}
  .pick:last-child{border-bottom:none}
  .pick .info{flex:1;min-width:0}.pick .info .t{font-size:14px;font-weight:500}.pick .info .s{font-size:12px;color:var(--muted);margin-top:2px}
  .pick .price{font-weight:700;font-size:13.5px;margin-right:2px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
  .stepper button{width:30px;height:30px;border:none;background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center}
  .stepper button:active{background:var(--sel)}
  .stepper .q{width:26px;text-align:center;font-weight:700;font-size:13px}
  .add-btn{border:1px solid var(--pri);color:var(--pri-d);background:var(--card);border-radius:7px;height:30px;padding:0 12px;font-weight:500;font-size:12.5px;cursor:pointer;font-family:var(--ui)}

  .cartbar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 14px;background:var(--card);border-top:1px solid var(--line);z-index:8;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .cartbar.on{transform:none}
  .cartbar .sumline{display:flex;align-items:baseline;margin-bottom:10px}
  .cartbar .sumline .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
  .cartbar .sumline .n{margin-left:auto;font-weight:700;font-size:24px}.cartbar .sumline .c{font-size:12px;color:var(--muted);margin-left:6px}

  .bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px 4px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bars .b .bar{width:100%;max-width:26px;background:var(--pri);border-radius:4px 4px 0 0}
  .bars .b.today .bar{background:var(--pri-d)}.bars .b .lb{font-size:10px;color:var(--muted)}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:16px;padding:0 2px}
  .legend b{color:var(--ink)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .emptybig{text-align:center;color:var(--faint);padding:56px 30px;line-height:1.55}
  .emptybig svg{width:66px;height:66px;stroke:#c4c8cd;fill:none;stroke-width:1.3;margin-bottom:16px}
  .emptybig .et{font-size:14.5px;max-width:26ch;margin:0 auto}
  .emptybig .eplus{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--fab);color:#fff;font-weight:700;margin:0 3px;vertical-align:middle;font-size:16px}
  .empty{text-align:center;color:var(--faint);font-size:13.5px;padding:40px 20px}
  .backrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;padding:12px 14px 0}
  .backrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
  .movesign{font-weight:700;font-size:14px}.movesign.in{color:var(--green)}.movesign.out{color:var(--red)}

  .fab{position:absolute;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--fab);color:#fff;border:none;display:grid;place-items:center;box-shadow:0 8px 18px -4px rgba(0,0,0,.45);cursor:pointer;z-index:7}
  .fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}

  .toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2b2f34;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:14;display:flex;align-items:center;gap:9px;pointer-events:none;box-shadow:0 10px 26px -8px rgba(0,0,0,.5);max-width:88%}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast svg{width:16px;height:16px;stroke:#8fd6a6;fill:none;stroke-width:2.6;flex:none}

  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:298px;max-width:84%;background:var(--card);z-index:10;transform:translateX(-100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,.25)}
  .device.drawer-open .scrim{opacity:1;pointer-events:auto}.device.drawer-open .drawer{transform:none}
  .dh{flex:none;background:linear-gradient(140deg,var(--pri-l),var(--pri-d));color:#fff;padding:16px 16px 14px;position:relative;overflow:hidden}
  .dh .illus{position:absolute;right:8px;top:8px;width:118px;height:92px;opacity:.96}
  .dh .logo{display:flex;align-items:center;gap:9px;margin-bottom:34px}
  .dh .logo .mk{width:30px;height:30px}.dh .logo .mk .bead{fill:#fff}.dh .logo .nm{font-weight:900;font-size:18px}
  .dh .shop{font-size:16px;font-weight:500}.dh .sub{font-size:12px;color:#e4e6e8;margin-top:2px;display:flex;align-items:center;gap:5px}
  .dh .sub .on{width:7px;height:7px;border-radius:50%;background:#8fd6a6;display:inline-block}
  .dl{flex:1;overflow-y:auto;padding:6px 0}
  .di{display:flex;align-items:center;gap:16px;padding:12px 18px;cursor:pointer;color:var(--ink);font-size:14.5px;font-weight:500}
  .di svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .di:active{background:var(--sel)}.di.on{background:var(--sel)}.di.on svg{stroke:var(--pri-d)}
  .di.soon{color:var(--faint)}.di.soon svg{stroke:var(--faint)}
  .di .soonx{margin-left:auto;font-size:9.5px;background:var(--line2);color:var(--muted);border-radius:5px;padding:1px 6px;font-weight:600}
  .dsep{height:1px;background:var(--line2);margin:6px 18px}

  /* ---- add product form ---- */
  .formscreen{position:absolute;inset:0;background:var(--bg);z-index:11;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
  .device.form-open .formscreen{transform:none;visibility:visible}
  .formbar{flex:none;height:56px;background:var(--pri);color:#fff;display:flex;align-items:center;gap:4px;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .formbar .ftitle{font-size:18px;font-weight:500;flex:1;margin-left:4px}
  .formbar .fsave{background:transparent;border:none;color:#fff;font-family:var(--ui);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;cursor:pointer;border-radius:8px}
  .formbar .fsave:active{background:rgba(255,255,255,.15)}
  .formbody{flex:1;overflow-y:auto;padding:16px 14px 40px;display:flex;flex-direction:column;gap:15px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fl{font-size:12.5px;font-weight:600;color:var(--muted)}
  .fl .opt{color:var(--faint);font-weight:400}
  .req{color:var(--red)}
  .inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-family:var(--ui);font-size:15px;color:var(--ink);background:var(--card);outline:none}
  .inp:focus{border-color:var(--pri)}
  textarea.inp{resize:vertical;min-height:44px}
  select.inp{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%236c7177' stroke-width='2'><path d='M6 8l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .keyrow{display:flex;gap:8px}.keyrow .inp{flex:1;font-family:ui-monospace,monospace;letter-spacing:.03em}
  .genbtn{flex:none;border:1px solid var(--pri);color:#fff;background:var(--pri);border-radius:8px;padding:0 14px;font-family:var(--ui);font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .genbtn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2}
  .genbtn:active{opacity:.9}
  .imgdrop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);cursor:pointer;background:var(--card);text-align:center;position:relative;overflow:hidden}
  .imgdrop svg{width:30px;height:30px;stroke:var(--faint);fill:none;stroke-width:1.6}
  .imgdrop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .imgdrop .ph{font-size:13px}
  .imgdrop.has{padding:0;border-style:solid}
  .imgdrop img{width:100%;max-height:150px;object-fit:cover;display:block}
  .imgdrop .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:15px;display:grid;place-items:center;z-index:2}
  .switchrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
  .switchrow .sw-l{flex:1}.switchrow .sw-l .t{font-size:14px;font-weight:500}.switchrow .sw-l .s{font-size:12px;color:var(--muted);margin-top:2px}
  .switch{position:relative;width:44px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .tk{position:absolute;inset:0;background:var(--line);border-radius:100px;transition:.2s;cursor:pointer}
  .switch .tk:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked+.tk{background:var(--green)}.switch input:checked+.tk:before{transform:translateX(18px)}
  .expwrap{margin-top:12px;display:none}.expwrap.on{display:block}
  .delbtn{margin-top:6px;width:100%;border:1px solid #e6c3bc;background:#fdf3f1;color:var(--red);border-radius:8px;padding:12px;font-family:var(--ui);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .delbtn svg{width:17px;height:17px;stroke:var(--red);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .delbtn:active{opacity:.85}

  .permdlg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:16;display:none;align-items:center;justify-content:center;padding:26px}
  .permdlg.on{display:flex}
  .permcard{background:var(--card);border-radius:14px;padding:22px 20px 16px;max-width:320px;width:100%;box-shadow:0 20px 50px -12px rgba(0,0,0,.5)}
  .permcard .pi{width:48px;height:48px;border-radius:12px;background:var(--sel);display:grid;place-items:center;margin-bottom:14px}
  .permcard .pi svg{width:26px;height:26px;stroke:var(--pri-d);fill:none;stroke-width:1.8}
  .permcard .pt{font-size:17px;font-weight:700;margin-bottom:7px}
  .permcard .pb{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:18px}

function scVentas(){

function scNueva(){

    return `<div class="pick"><div class="info"><div class="t">${p.name}</div><div class="s">${p.cat||'—'} · ${p.stock} ${t('inStock')}</div></div><span class="price num">${money(p.price)}</span>${ctl}</div>`;}).join("");

function scCaja(){
  const moves=[...state.sales.map(s=>({type:"in",concept:"Venta #"+s.id,amount:saleTotal(s),time:s.time})),...state.extraMoves].sort((a,b)=>b.time.localeCompare(a.time));
  const rows=moves.length?moves.map(m=>`<div class="row"><div class="av">${svg(m.type==="in"?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M12 5v14M6 13l6 6 6-6"/>')}</div><div><div class="t">${m.concept}</div><div class="s">${m.time}</div></div><div class="r"><span class="movesign ${m.type==='in'?'in':'out'} num">${m.type==='in'?'+':'−'}${money(m.amount)}</span></div></div>`).join(""):`<div class="empty">${t('noSales')}</div>`;
  return `<div class="kpis"><div class="kpi hero"><div class="k-l">${t('cashBal')}</div><div class="k-v num">$${cashBalance().toLocaleString(LANG==='es'?'es-CO':'en-US')}</div><div class="k-sub" style="color:#e2e4e6">${t('base')} ${money(state.base)} · ${t('m_ventas')} ${money(todaySales())}</div></div></div>

  <div class="section-h"><h2>${t('movesToday')}</h2></div><div class="list">${rows}</div>`;

function scReportes(){
  const week=[...state.week,todaySales()];const max=Math.max(...week)||1;const labels=LANG==='es'?["lun","mar","mié","jue","vie","sáb","dom"]:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const bars=week.map((v,i)=>`<div class="b ${i===6?'today':''}"><div class="bar" style="height:${Math.max(6,v/max*100)}%"></div><div class="lb">${labels[i]}</div></div>`).join("");
  const totWeek=week.reduce((a,b)=>a+b,0);
  const top=state.products.map(p=>{const qty=state.sales.reduce((a,s)=>a+(s.items.find(i=>i.id===p.id)?.q||0),0);return{p,qty,rev:qty*p.price};}).filter(x=>x.qty>0).sort((a,b)=>b.rev-a.rev).slice(0,4);
  const topRows=top.length?top.map(x=>`<div class="row"><div class="av num">${x.qty}</div><div><div class="t">${x.p.name}</div><div class="s">${x.qty} ${t('sold')}</div></div><div class="r"><div class="amt num">${money(x.rev)}</div></div></div>`).join(""):`<div class="empty">${t('noSales')}</div>`;
  return `<div class="section-h"><h2>${t('salesPerDay')}</h2></div><div class="bars">${bars}</div>
  <div class="legend"><span><span class="dot" style="background:var(--pri)"></span>${t('week')} <b class="num">${money(totWeek)}</b></span><span><span class="dot" style="background:var(--pri-d)"></span>${t('today')} <b class="num">${money(todaySales())}</b></span></div>
  <div class="kpis"><div class="kpi"><div class="k-l">${t('profitToday')}</div><div class="k-v num" style="color:var(--green)">${money(ganancia())}</div></div><div class="kpi"><div class="k-l">${t('avgTicket')}</div><div class="k-v num">${money(todaySales()/Math.max(state.sales.length,1))}</div></div><div class="kpi"><div class="k-l">${t('numSales')}</div><div class="k-v num">${state.sales.length}</div></div></div>
  <div class="section-h"><h2>${t('topToday')}</h2></div><div class="list">${topRows}</div>`;
}
const SCREENS={inventario:scInventario,ventas:scVentas,nueva:scNueva,caja:scCaja,reportes:scReportes};

function openForm(editId){
  if(editId){const p=P(editId);state.form={editId,key:p.key,name:p.name,cat:p.cat,unit:p.unit,purchase:p.cost,sale:p.price,addsale:p.addSale,qty:p.stock,reserve:p.reserve,img:p.img,expiry:p.expiry||'',expiryOn:!!p.expiry,min:p.min,max:p.max,loc:p.loc,lot:p.lot};}
  else state.form={unit:'u_piece'};
  document.getElementById('formTitle').textContent=editId?t('editProduct'):t('newProduct');
  document.getElementById('saveBtn').textContent=t('save');
  document.getElementById('formBody').innerHTML=formHTML();
  document.getElementById('device').classList.add('form-open');
  document.getElementById('fab').style.display='none';
  document.getElementById('formBody').scrollTop=0;
  attachForm();
}
function attachForm(){
  const img=document.getElementById('imgInput');
  if(img)img.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{state.form.img=ev.target.result;refreshForm();};r.readAsDataURL(file);});
  const ex=document.getElementById('expToggle');
  if(ex)ex.addEventListener('change',e=>{if(e.target.checked){askPerm();e.target.checked=false;}else{state.form.expiryOn=false;document.getElementById('expWrap').classList.remove('on');}});
}
function refreshForm(){readForm();document.getElementById('formBody').innerHTML=formHTML();attachForm();}
function readForm(){
  const g=id=>document.getElementById(id);const f=state.form;
  if(g('f_key'))f.key=g('f_key').value; if(g('f_name'))f.name=g('f_name').value; if(g('f_cat'))f.cat=g('f_cat').value;
  if(g('f_unit'))f.unit=g('f_unit').value; if(g('f_purchase'))f.purchase=g('f_purchase').value; if(g('f_sale'))f.sale=g('f_sale').value;
  if(g('f_addsale'))f.addsale=g('f_addsale').value; if(g('f_qty'))f.qty=g('f_qty').value; if(g('f_reserve'))f.reserve=g('f_reserve').value;
  if(g('f_expiry'))f.expiry=g('f_expiry').value;
  if(g('f_min'))f.min=g('f_min').value; if(g('f_max'))f.max=g('f_max').value; if(g('f_loc'))f.loc=g('f_loc').value; if(g('f_lot'))f.lot=g('f_lot').value;
}
function closeForm(){document.getElementById('device').classList.remove('form-open');document.getElementById('fab').style.display='grid';}
function genKey(){readForm();const ex=new Set(state.products.map(p=>p.key));let k;do{k='SKU-'+Math.random().toString(36).slice(2,6).toUpperCase();}while(ex.has(k));state.form.key=k;document.getElementById('formBody').innerHTML=formHTML();attachForm();}
function askPerm(){const g=id=>document.getElementById(id);g('permT').textContent=t('perm_title');g('permB').textContent=t('perm_body');g('permAllow').textContent=t('perm_allow');g('permDeny').textContent=t('perm_deny');g('permdlg').classList.add('on');}
function permResult(ok){document.getElementById('permdlg').classList.remove('on');const chk=document.getElementById('expToggle');
  if(ok){state.form.expiryOn=true;if(chk)chk.checked=true;document.getElementById('expWrap').classList.add('on');try{if(window.Notification&&Notification.requestPermission)Notification.requestPermission().catch(()=>{});}catch(_){}}
  else{state.form.expiryOn=false;if(chk)chk.checked=false;}}
function saveProduct(){
  readForm();const f=state.form;
  if(!f.name||!f.name.trim()||!f.key||!f.key.trim()){toast(t('needNameKey'));return;}
  const cat=(f.cat||'').trim(); if(cat&&!state.cats.includes(cat))state.cats.push(cat);
  const data={key:f.key.trim(),name:f.name.trim(),cat,unit:f.unit,cost:+f.purchase||0,price:+f.sale||0,addSale:+f.addsale||0,stock:+f.qty||0,reserve:+f.reserve||0,img:f.img||null,expiry:f.expiryOn?f.expiry:null,min:+f.min||0,max:+f.max||0,loc:(f.loc||'').trim(),lot:(f.lot||'').trim()};
  if(f.editId){const p=P(f.editId);if(p)Object.assign(p,data);closeForm();state.screen='inventario';render();toast(t('updated'));}
  else{state.products.push({id:state.seq++,...data});closeForm();state.screen='inventario';render();toast(t('saved'));}
}
function delProduct(){const id=state.form.editId;state.products=state.products.filter(p=>p.id!==id);closeForm();state.screen='inventario';render();toast(t('deleted'));}

function go(s){if(s==="nueva"||s==="inventario")state.q="";state._keep=0;state.screen=s;drawer(false);render();}
function checkout(){const items=cartItems();if(!items.length)return;const id=(state.sales[0]?.id||100)+1;items.forEach(i=>{const p=P(i.id);if(p)p.stock=Math.max(0,p.stock-i.q);});const d=new Date();const tm=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;const tot=cartTotal();state.sales.unshift({id,time:tm,items:items.map(i=>({id:i.id,q:i.q}))});state.cart={};state.screen="ventas";render();toast(`Venta #${id} · ${money(tot)}`);}

  }else if(s==='local_choose'){
    h=`<h2>${t('ob_local_q')}</h2>
    <button class="ocard" data-act="ob:local_ancla"><div class="oic">${svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12l3 3 5-5"/>')}</div><div><div class="ot">${t('ob_local_ancla')}</div><div class="od">${t('ob_local_ancla_d')}</div></div></button>
    <button class="ocard" data-act="ob:local_propia"><div class="oic">${svg(IC.inventario)}</div><div><div class="ot">${t('ob_local_propia')}</div><div class="od">${t('ob_local_propia_d')}</div></div></button>`;
  }else if(s==='local_ancla'){
    h=`<h2>${t('ob_local_ancla')}</h2>${fld('ob_name',t('ob_local_name'),t('ob_local_name_ph'),tmp.name)}${fld('ob_id',t('ob_enter_id'),t('ob_enter_id_ph'),tmp.linkedId)}<button class="btn obtn" data-act="ob:finishLocalAncla">${t('ob_enter')}</button>`;
  }else if(s==='local_propia'){
    h=`<h2>${t('ob_local_propia')}</h2>${fld('ob_name',t('ob_local_name'),t('ob_local_name_ph'),tmp.name)}<button class="btn obtn" data-act="ob:finishLocalPropia">${t('ob_enter')}</button>`;
  }
  document.getElementById('onboBody').innerHTML=h;
}
function obVal(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function finishOnbo(p){state.profile=p;saveProfile();document.getElementById('onbo').classList.remove('on');renderDrawer();state.screen='inventario';state.q='';render();}
function obAction(sub){
  const tmp=state.onbo.tmp;
  if(sub==='role')return obGo('role');
  if(sub==='bodega')return obGo('bodega_name');
  if(sub==='local')return obGo('local_choose');
  if(sub==='bodega_id'){const n=obVal('ob_name');if(!n){toast(t('ob_need_name'));return;}tmp.name=n;tmp.id=genBodegaId();return obGo('bodega_id');}
  if(sub==='finishBodega')return finishOnbo({type:'bodega',name:tmp.name,id:tmp.id});
  if(sub==='local_ancla')return obGo('local_ancla');
  if(sub==='local_propia')return obGo('local_propia');
  if(sub==='finishLocalAncla'){const n=obVal('ob_name'),id=obVal('ob_id');if(!n){toast(t('ob_need_name'));return;}if(!id){toast(t('ob_need_id'));return;}return finishOnbo({type:'local',localKind:'anclada',name:n,linkedId:id.toUpperCase()});}
  if(sub==='finishLocalPropia'){const n=obVal('ob_name');if(!n){toast(t('ob_need_name'));return;}return finishOnbo({type:'local',localKind:'propia',name:n,id:genBodegaId()});}
}
function doLogout(){clearProfile();state.profile=null;drawer(false);state.onbo={step:'welcome',tmp:{}};document.getElementById('onbo').classList.add('on');renderOnbo();}
function boot(){
  let p=null;try{p=JSON.parse(localStorage.getItem('abanico.profile')||'null')}catch(_){}
  state.profile=p;renderDrawer();render();
  if(!p){state.onbo={step:'welcome',tmp:{}};document.getElementById('onbo').classList.add('on');renderOnbo();}
}

const TOASTS={notif:'notif',more:'more',scanner:'scanner',categories:'categories',filters:'filters',addmove:'addMove',closereg:'closeRegDemo'};
document.getElementById("device").addEventListener("click",e=>{
  if(e.target.id==='catdlg')return closeCat();
  const el=e.target.closest("[data-nav],[data-inc],[data-dec],[data-stock],[data-act],[data-drawer],[data-di],[data-fab],[data-edit],[data-catpick]");
  if(!el)return;
  if(el.hasAttribute("data-catpick")){const v=el.dataset.catpick;state.filterCat=v==='__all__'?null:v;closeCat();return render();}
  state._keep=document.getElementById("screen").scrollTop;
  if(el.dataset.drawer)return drawer(el.dataset.drawer==="open");
  if(el.hasAttribute("data-di")){if(el.dataset.soon==="1"){drawer(false);return toast(t('m_'+el.dataset.di)+" · "+t('soon'));}return go(el.dataset.di);}
  if(el.hasAttribute("data-fab"))return state.screen==="inventario"?openForm():go("nueva");
  if(el.hasAttribute("data-edit"))return openForm(+el.dataset.edit);
  if(el.dataset.nav)return go(el.dataset.nav);
  if(el.dataset.inc){const id=+el.dataset.inc;state.cart[id]=(state.cart[id]||0)+1;return render();}
  if(el.dataset.dec){const id=+el.dataset.dec;state.cart[id]=Math.max(0,(state.cart[id]||0)-1);return render();}
  if(el.dataset.stock){const[id,dd]=el.dataset.stock.split(":");const p=P(+id);if(p)p.stock=Math.max(0,p.stock+ +dd);return render();}
  if(el.dataset.act){const a=el.dataset.act.split(":")[0];
    if(a==="checkout")return checkout();
    if(a==="clearq"){state.q="";return render();}
    if(a==="close-form")return closeForm();
    if(a==="save-product")return saveProduct();
    if(a==="genkey")return genKey();
    if(a==="del-product")return delProduct();
    if(a==="filtercat")return openCatFilter();
    if(a==="rm-img"){readForm();state.form.img=null;document.getElementById('formBody').innerHTML=formHTML();return attachForm();}
    if(a==="perm-allow")return permResult(true);
    if(a==="perm-deny")return permResult(false);
    if(a==="ob")return obAction(el.dataset.act.split(":")[1]);
    if(a==="logout")return doLogout();
    if(a==="toast"){const key=el.dataset.act.split(":")[1];return toast(t(TOASTS[key]||'more'));}
  }
});
boot();
</script>
