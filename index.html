<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#565b60">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ábaco">
<meta name="application-name" content="Ábaco">
<title>Abanico · Bodega y Local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
  :root{
    --pri:#6f757a;--pri-d:#565b60;--pri-l:#828990;--fab:#5f656a;
    --ink:#20232a;--muted:#6c7177;--faint:#9aa0a6;--line:#e6e7ea;--line2:#f0f1f3;
    --bg:#f3f4f5;--card:#ffffff;--sel:#eceef0;--green:#2e7d4f;--red:#c8452f;--amber:#b07414;
    --ui:"Roboto",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:var(--ui);color:var(--ink);background:linear-gradient(160deg,#3a3d42,#181a1d);
    display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  .device{position:relative;width:100%;max-width:412px;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  @media (max-width:479px){body{align-items:flex-start}}
  @media (min-width:480px){.device{height:min(880px,94vh);max-height:94vh;border-radius:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);border:1px solid #000}}

  .statusbar{flex:none;height:26px;background:var(--pri-d);color:#eceef0;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:500;gap:6px}
  .statusbar .sb-r{margin-left:auto;display:flex;align-items:center;gap:6px}
  .statusbar svg{width:14px;height:14px;fill:#eceef0}

  .appbar{flex:none;background:var(--pri);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;height:56px;box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;z-index:6}
  .iconbtn{width:44px;height:44px;border:none;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:50%}
  .iconbtn:active{background:rgba(255,255,255,.15)}
  .iconbtn svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .appbar .title{margin-left:4px;flex:1;min-width:0;line-height:1.15}
  .appbar .title .t1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appbar .title .t2{font-size:12.5px;color:#e6e8ea;font-weight:400}
  .badge-dot{position:absolute;top:11px;right:9px;width:7px;height:7px;background:var(--red);border-radius:50%}

  .invhead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .isearch{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
  .isearch svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9;flex:none}
  .isearch input{border:none;outline:none;background:transparent;font-family:var(--ui);font-size:14px;width:100%;color:var(--ink);min-width:0}
  .isearch .clr{color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;flex:none}
  .round{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none}
  .round svg{width:20px;height:20px;stroke:var(--pri-d);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer}
  .fchip svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .fchip.act{background:var(--pri);color:#fff;border-color:var(--pri)}
  .fchip.act svg{stroke:#fff}
  .fchip.io{border-color:var(--ink);color:var(--ink);font-weight:600}
  .fchip.io svg{stroke:var(--ink)}
  .pcards{display:flex;flex-direction:column;gap:11px}
  .pcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px 14px;cursor:pointer}
  .pcard:active{background:var(--sel)}
  .pc-top{display:flex;align-items:center;gap:13px}
  .pc-img{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--sel);flex:none;overflow:hidden;display:grid;place-items:center}
  .pc-img img{width:100%;height:100%;object-fit:cover}
  .pc-img svg{width:28px;height:28px;stroke:var(--faint);fill:none;stroke-width:1.6}
  .pc-id{flex:1;min-width:0}
  .pc-key{font-size:18px;font-weight:600;color:#3b4046;line-height:1.2;word-break:break-word}
  .pc-name{font-size:14.5px;color:var(--muted);margin-top:1px}
  .origchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;padding:3px 8px 3px 6px;border-radius:20px;margin-top:6px;background:#eceef0;color:#565b60;max-width:100%}
  .origchip svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none}
  .origchip.own{background:#e6f1ea;color:#3a7a4e}
  .tbars{display:flex;flex-direction:column;gap:13px;margin-top:2px}
  .tbar-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
  .tbar-nm{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
  .tbar-track{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}
  .tbar-fill{height:100%;border-radius:6px;transition:width .3s}
  .bkwrap{max-width:520px;margin:0 auto;padding-top:6px}
  .bkhero{width:76px;height:76px;margin:14px auto 4px;border-radius:20px;background:var(--sel);display:grid;place-items:center}
  .bkhero svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.5}
  .bkerr{margin-top:14px;display:flex;gap:8px;align-items:center;background:#fdeceb;color:#b23b32;border-radius:12px;padding:11px 13px;font-size:13px}
  .bkerr svg{width:18px;height:18px;flex:none;stroke:#b23b32;fill:none;stroke-width:1.8}
  .bkok{display:flex;gap:8px;align-items:center;background:#e6f1ea;color:#2f7a4e;border-radius:12px;padding:12px 13px;font-size:13.5px;font-weight:600;margin-bottom:10px}
  .bkok svg{width:18px;height:18px;flex:none;stroke:#2f7a4e;fill:none;stroke-width:2.2}
  .bkload{display:flex;flex-direction:column;align-items:center;gap:16px;padding:70px 0;color:var(--muted)}
  .bkload svg{width:42px;height:42px;stroke:var(--pri);fill:none;stroke-width:2}
  .bks{font-size:13px}
  .spin{animation:bkspin 1s linear infinite;transform-origin:center}
  @keyframes bkspin{to{transform:rotate(360deg)}}
  .bkbiz{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .bkbiz-ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--sel);display:grid;place-items:center}
  .bkbiz-ic svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:1.6}
  .bkbiz-n{font-weight:700;font-size:15px}
  .bkbiz-s{font-size:12px;color:var(--muted);margin-top:2px}
  .kpis3{margin-bottom:8px}
  .bkdates{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin:6px 2px 14px}
  .bkdates svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .bkdates b{color:var(--ink)}
  .loadmore{text-align:center;padding:14px;margin:2px 0 4px;color:var(--pri);font-weight:600;font-size:13.5px;cursor:pointer}
  .sh-rec h2{display:flex;align-items:center;gap:7px}.sh-rec svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.9}
  .scards{display:flex;flex-direction:column;gap:12px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .scard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .scard-fol{font-weight:700;font-size:15px;color:var(--ink)}
  .scard-pay{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .scard-pay svg{width:20px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6;flex:none}
  .scard-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);padding:2px 0}
  .scard-row svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.7;flex:none}
  .scard-row span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .scard-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-top:9px;border-top:1px solid var(--line2)}
  .scard-paid{color:var(--green);font-weight:700;font-size:14px}
  .scard-tot{text-align:right}.scard-tl{display:block;font-size:11px;color:var(--muted)}.scard-tot b{font-size:19px;color:var(--ink)}
  .salehelp{margin-top:22px;font-size:13px;line-height:1.7;color:var(--muted);text-align:center;padding:0 10px}
  .hicon{border:none;background:var(--sel);color:var(--ink);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none}
  .hicon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
  .histdlg{position:absolute;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
  .histdlg.on{display:flex}
  .histbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
  .histbar-t{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .histbody{flex:1;overflow-y:auto;padding:14px 14px 24px}
  .clilist{display:flex;flex-direction:column;gap:10px}
  .clicard{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .cli-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer}
  .cli-ic{width:38px;height:38px;flex:none;border-radius:50%;background:var(--sel);display:grid;place-items:center}
  .cli-ic svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.7}
  .cli-tx{min-width:0}
  .cli-n{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cli-a{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:1px}
  .cli-actions{display:flex;gap:2px;flex:none}
  .cli-act{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none}
  .cli-act:active{background:var(--sel)}
  .cli-act svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .pc-warn{flex:none;align-self:flex-start}.pc-warn svg{width:26px;height:26px}
  .pc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
  .pc-m{text-align:center}.pc-ml{font-size:13px;color:var(--muted)}.pc-mv{font-size:22px;font-weight:700;margin-top:3px}.pc-mv.warnv{color:var(--red)}
  .sheetdlg{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:16;display:none;align-items:flex-end}
  .sheetdlg.on{display:flex}
  .sheetcard{background:var(--card);width:100%;border-radius:16px 16px 0 0;max-height:72%;display:flex;flex-direction:column;padding-bottom:10px;box-shadow:0 -8px 30px -10px rgba(0,0,0,.4)}
  .sheet-h{padding:14px 12px 12px 18px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sheet-x{border:none;background:var(--sel);color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;flex:none;display:grid;place-items:center}
  .sheet-x:active{background:var(--line)}
  .sheet-list{overflow-y:auto;padding:4px 0}
  .catopt{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;font-size:15px;color:var(--ink)}
  .catopt:active{background:var(--sel)}.catopt.sel{color:var(--pri-d);font-weight:600}
  .catopt .ck{width:20px;height:20px;flex:none}.catopt .ck svg{width:20px;height:20px;stroke:var(--pri-d);fill:none;stroke-width:2.2}
  .notirow{padding:13px 18px;border-bottom:1px solid var(--line2)}
  .notirow:last-child{border-bottom:none}
  .notirow.unread{background:#f6f7f8}
  .notirow .ntext{font-size:14px;line-height:1.4;color:var(--ink)}

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
  .pad{padding:12px 12px 90px}

  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
  .kpi .k-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
  .kpi .k-v{font-size:17px;font-weight:700;margin-top:4px}
  .kpi.hero{grid-column:1/-1;background:var(--pri);color:#fff;border-color:var(--pri)}
  .kpi.hero .k-l{color:#e2e4e6}.kpi.hero .k-v{font-size:29px;color:#fff}
  .kpi .k-sub{font-size:11px;color:var(--muted);margin-top:2px}

  .btn{font-family:var(--ui);font-weight:500;font-size:15px;border:none;border-radius:8px;padding:13px;width:100%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
  .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);text-transform:none;font-weight:500}
  .btn.dark{background:var(--ink);color:#fff}
  .btn:active{opacity:.9}

  .section-h{display:flex;align-items:center;margin:18px 3px 9px}
  .section-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0}
  .section-h a{margin-left:auto;font-size:12.5px;color:var(--pri-d);font-weight:500;text-decoration:none}

  .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row .av{width:36px;height:36px;border-radius:8px;background:var(--sel);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--pri-d);flex:none;overflow:hidden}
  .row .av img{width:100%;height:100%;object-fit:cover}
  .row .av svg{width:18px;height:18px;stroke:var(--pri-d);fill:none;stroke-width:2}
  .row .t{font-size:14px;font-weight:500;line-height:1.2}
  .row .s{font-size:12px;color:var(--muted);margin-top:2px}
  .row .r{margin-left:auto;text-align:right}
  .row .amt{font-weight:700;font-size:14px}.row .r .s{margin-top:2px}
  .chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:100px;border:1px solid var(--line);color:var(--muted)}
  .chip.low{color:var(--red);border-color:#eec6be;background:#fbeeeb}
  .chip.ok{color:var(--green);border-color:#c4e2ce;background:#eef7f1}

  .search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--card)}
  .search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .search input{border:none;outline:none;font-family:var(--ui);font-size:14px;width:100%;background:transparent;color:var(--ink)}
  .pick{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line2)}
  .pick:last-child{border-bottom:none}
  .pick .info{flex:1;min-width:0}.pick .info .t{font-size:14px;font-weight:500}.pick .info .s{font-size:12px;color:var(--muted);margin-top:2px}
  .pick .price{font-weight:700;font-size:13.5px;margin-right:2px}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
  .stepper button{width:30px;height:30px;border:none;background:var(--card);color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center}
  .stepper button:active{background:var(--sel)}
  .stepper .q{width:26px;text-align:center;font-weight:700;font-size:13px}
  .add-btn{border:1px solid var(--pri);color:var(--pri-d);background:var(--card);border-radius:7px;height:30px;padding:0 12px;font-weight:500;font-size:12.5px;cursor:pointer;font-family:var(--ui)}

  .cartbar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 14px;background:var(--card);border-top:1px solid var(--line);z-index:8;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .cartbar.on{transform:none}
  .cartbar .sumline{display:flex;align-items:baseline;margin-bottom:10px}
  .cartbar .sumline .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
  .cartbar .sumline .n{margin-left:auto;font-weight:700;font-size:24px}.cartbar .sumline .c{font-size:12px;color:var(--muted);margin-left:6px}

  .bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px 4px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bars .b .bar{width:100%;max-width:26px;background:var(--pri);border-radius:4px 4px 0 0}
  .bars .b.today .bar{background:var(--pri-d)}.bars .b .lb{font-size:10px;color:var(--muted)}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:16px;padding:0 2px}
  .legend b{color:var(--ink)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .emptybig{text-align:center;color:var(--faint);padding:56px 30px;line-height:1.55}
  .emptybig svg{width:66px;height:66px;stroke:#c4c8cd;fill:none;stroke-width:1.3;margin-bottom:16px}
  .emptybig .et{font-size:14.5px;max-width:26ch;margin:0 auto}
  .emptybig .eplus{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--fab);color:#fff;font-weight:700;margin:0 3px;vertical-align:middle;font-size:16px}
  .empty{text-align:center;color:var(--faint);font-size:13.5px;padding:40px 20px}
  .backrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;padding:12px 14px 0}
  .backrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
  .movesign{font-weight:700;font-size:14px}.movesign.in{color:var(--green)}.movesign.out{color:var(--red)}

  .fab{position:absolute;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--fab);color:#fff;border:none;display:grid;place-items:center;box-shadow:0 8px 18px -4px rgba(0,0,0,.45);cursor:pointer;z-index:7}
  .fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}

  .toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2b2f34;color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:14;display:flex;align-items:center;gap:9px;pointer-events:none;box-shadow:0 10px 26px -8px rgba(0,0,0,.5);max-width:88%}
  .toast.on{opacity:1;transform:translate(-50%,0)}

function ioNum(v){
  let s=(''+(v==null?'':v)).trim().replace(/[^0-9.,-]/g,'');if(!s)return 0;
  const hasDot=s.indexOf('.')>=0,hasComma=s.indexOf(',')>=0;
  if(hasDot&&hasComma){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');}
  else if(hasComma)s=s.replace(',','.');
  else if(hasDot&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
function ioParseCSV(txt){
  const rows=[];let i=0,cell='',row=[],q=false;
  const push=()=>{row.push(cell);cell='';};const endr=()=>{push();rows.push(row);row=[];};
  while(i<txt.length){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else{if(c==='"')q=true;else if(c===','||c===';')push();else if(c==='\n')endr();else if(c==='\r'){}else cell+=c;}
    i++;
  }
  if(cell.length||row.length)endr();
  if(rows.length<2)return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const idx=names=>{for(const n of names){const k=head.indexOf(n);if(k>=0)return k;}return -1;};
  const ci={key:idx(['codigo','código','key','sku','barcode','codigo de barras']),name:idx(['nombre','name','producto','product']),cat:idx(['categoria','categoría','category','cat']),stock:idx(['cantidad','stock','qty','existencia']),cost:idx(['precio_compra','p_compra','costo','cost','compra']),price:idx(['precio_venta','p_venta','precio','price','venta']),reserve:idx(['reserva','reserve'])};
  const out=[];
  for(let r=1;r<rows.length;r++){const cells=rows[r];if(!cells.length||cells.every(x=>!(''+x).trim()))continue;
    const name=(ci.name>=0?cells[ci.name]:cells[0])||'';if(!name.trim())continue;
    out.push({key:ci.key>=0?(cells[ci.key]||'').trim():'',name:name.trim(),cat:ci.cat>=0?(cells[ci.cat]||'').trim():'',stock:ci.stock>=0?ioNum(cells[ci.stock]):0,cost:ci.cost>=0?ioNum(cells[ci.cost]):0,price:ci.price>=0?ioNum(cells[ci.price]):0,reserve:ci.reserve>=0?ioNum(cells[ci.reserve]):0});
  }
  return out;
}
function importProducts(list,stay){
  let added=0,updated=0;
  list.forEach(it=>{
    const key=(it.key||'').trim();let ex=null;
    if(key)ex=state.products.find(p=>(p.key||'')===key);
    if(!ex&&it.name)ex=state.products.find(p=>p.name.toLowerCase()===(it.name||'').toLowerCase());
    if(ex){if(it.name)ex.name=it.name;if(it.cat)ex.cat=it.cat;if(isFinite(it.stock))ex.stock=it.stock;if(it.cost)ex.cost=it.cost;if(it.price)ex.price=it.price;if(isFinite(it.reserve))ex.reserve=it.reserve;if(key)ex.key=key;if(it.imgKey)ex.imgKey=it.imgKey;updated++;}
    else{state.products.push({id:state.seq++,key:key||('IMP-'+state.seq),name:it.name,cat:it.cat||'',unit:'u_piece',cost:it.cost||0,price:it.price||0,addSale:0,stock:isFinite(it.stock)?it.stock:0,reserve:it.reserve||0,img:null,imgKey:it.imgKey||null,expiry:null});added++;}
  });
  persist();closeIO();
  if(!stay){state.invLimit=INV_PAGE;state.screen='inventario';render();toast(ti('io_done_imp',{a:added,u:updated}));}
  return {added,updated};
}
function handleImportFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const txt=(''+reader.result).replace(/^﻿/,'');const trimmed=txt.trim();
      let prods;
      if(/\.json$/i.test(file.name)||trimmed[0]==='{'||trimmed[0]==='['){const j=JSON.parse(trimmed);prods=Array.isArray(j)?j:(j.products||[]);prods=prods.map(p=>({key:p.key||'',name:p.name||p.nombre||'',cat:p.cat||p.categoria||'',stock:+(p.stock!=null?p.stock:p.cantidad)||0,cost:+(p.cost!=null?p.cost:p.p_compra)||0,price:+(p.price!=null?p.price:p.p_venta)||0,reserve:+(p.reserve!=null?p.reserve:p.reserva)||0}));}
      else prods=ioParseCSV(txt);
      if(!prods||!prods.length){toast(t('io_empty'));return;}
      importProducts(prods.filter(p=>p.name&&(''+p.name).trim()));
    }catch(e){toast(t('io_err'));}
  };
  reader.onerror=()=>toast(t('io_err'));
  reader.readAsText(file);
}

function idbOpen(){

  IDBP=new Promise((res,rej)=>{try{const r=indexedDB.open('abanico',3);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('img'))db.createObjectStore('img');if(!db.objectStoreNames.contains('sale'))db.createObjectStore('sale');if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  return IDBP;
}
async function idbPut(key,val){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('img','readwrite');tx.objectStore('img').put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});}catch(e){return false;}}
async function idbKvPut(key,val){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);});}catch(e){return false;}}
async function idbKvGet(key){try{const db=await idbOpen();return await new Promise(res=>{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined);});}catch(e){return undefined;}}
function persistSales(){const id=currentDataId();if(id){idbKvPut('sales:'+id,state.sales);sbPushDoc(id,'sales',state.sales);}}
async function loadSales(id){const v=await idbKvGet('sales:'+id);if(v&&v.length){state.sales=v;if(currentDataId()===id)render();}else if(state.sales.length){await idbKvPut('sales:'+id,state.sales);}}
async function idbGetSale(id){try{const db=await idbOpen();return await new Promise(res=>{const tx=db.transaction('sale','readonly');const rq=tx.objectStore('sale').get(''+id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);});}catch(e){return null;}}
async function bkSaveSaleLines(byId){
  const ids=Object.keys(byId||{});if(!ids.length)return;
  try{const db=await idbOpen();
    for(let i=0;i<ids.length;i+=400){
      const chunk=ids.slice(i,i+400);
      await new Promise((res,rej)=>{const tx=db.transaction('sale','readwrite');const st=tx.objectStore('sale');chunk.forEach(id=>st.put(byId[id],''+id));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});
    }
  }catch(e){}
}

function bkBlobToThumb(blob,size){
  return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(blob);
    img.onload=()=>{try{const sc=Math.min(size/img.width,size/img.height,1);const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const d=cv.toDataURL('image/jpeg',0.6);URL.revokeObjectURL(url);res(d);}catch(e){URL.revokeObjectURL(url);res(null);}};
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};img.src=url;});
}
async function bkSaveImages(list){

  for(const p of list){
    try{
      if(!IMGCACHE['img:'+p.imgKey]){
        const name=state.bk&&state.bk.imgSet[p.imgKey];const f=name&&BKZIP.file(name);
        if(f){const blob=await f.async('blob');const thumb=await bkBlobToThumb(blob,160);if(thumb){IMGCACHE['img:'+p.imgKey]=thumb;await idbPut('img:'+p.imgKey,thumb);}}
      }
    }catch(_){}
    done++;
    if(done%40===0){toast(ti('bk_imgprog',{a:done,n:total}));if(state.screen==='inventario')bkApplyInvImages();}
  }
  if(state.screen==='inventario')bkApplyInvImages();

}

  if(typeof JSZip==='undefined')await bkScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');

function bkExec(db,sql){try{const r=db.exec(sql);if(!r.length)return [];const c=r[0].columns,v=r[0].values;return v.map(row=>{const o={};c.forEach((k,i)=>o[k]=row[i]);return o;});}catch(e){return [];}}
function bkScalar(db,sql){const r=bkExec(db,sql);if(!r.length)return null;return r[0][Object.keys(r[0])[0]];}
async function bkHandleFile(file){
  state.bkLoading=true;state.bkErr='';render();bkStatus(t('bk_reading'));
  try{
    await bkEnsureLibs();
    const buf=await file.arrayBuffer();
    bkStatus(t('bk_unzip'));
    const zip=await JSZip.loadAsync(buf);
    let dbEntry=zip.file('BD_MiNegocio');
    if(!dbEntry){const cand=zip.file(/(^|\/)BD[_A-Za-z0-9]*$|\.(db|sqlite)$/i);dbEntry=cand&&cand[0];}
    if(!dbEntry)throw new Error(t('bk_nodb'));
    const dbBuf=await dbEntry.async('uint8array');
    bkStatus(t('bk_readdb'));
    const SQL=await initSqlJs({locateFile:f=>BK_SQLBASE+f});
    const db=new SQL.Database(dbBuf);
    // negocio (config key 200)
    let biz={};try{(bkExec(db,'SELECT key,json FROM config')||[]).forEach(r=>{try{const j=JSON.parse(r.json);if(j&&(j.negocio||j.contacto))biz=j;}catch(_){}} );}catch(_){}
    const catRows=bkExec(db,'SELECT folio,nombre FROM categorias');
    const catMap={};catRows.forEach(c=>catMap[c.folio]=c.nombre);
    const products=bkExec(db,'SELECT key,nombre,cantidad,p_compra,p_venta,reserva,categoria FROM producto');
    const clients=bkExec(db,'SELECT folio,nombre_cliente,alias,telefono1,correo,direccion,info_adicional FROM cliente');
    // ventas + su detalle
    const payMap={};try{bkExec(db,'SELECT id_forma_pago,nombre FROM forma_pago').forEach(r=>payMap[r.id_forma_pago]=r.nombre);}catch(_){}
    const ventaRows=bkExec(db,'SELECT folio,fecha,hora,total,nombre_cliente,id_forma_pago,direccion,etiqueta,status FROM venta');
    const vlines=bkExec(db,'SELECT folio,nombre,cantidad,p_compra,p_venta,subtotal FROM venta_producto');
    const linesByFolio={};vlines.forEach(l=>{const k='V'+l.folio;(linesByFolio[k]=linesByFolio[k]||[]).push({name:l.nombre,qty:+l.cantidad||0,price:+l.p_venta||0,cost:+l.p_compra||0,subtotal:+l.subtotal||0});});
    const sales=ventaRows.map(v=>{const ls=linesByFolio['V'+v.folio]||[];const cost=ls.reduce((a,l)=>a+l.cost*l.qty,0);const n=ls.reduce((a,l)=>a+l.qty,0);return {id:'V'+v.folio,folio:v.folio,date:v.fecha||'',time:v.hora||'',total:+v.total||0,cost,client:v.nombre_cliente||'',pay:payMap[v.id_forma_pago]||'',addr:v.direccion||'',tag:v.etiqueta||'',status:v.status,n,imported:true};});
    const imgSet={};let imgCount=0;zip.forEach((p,f)=>{if(/\.jpe?g$/i.test(p)&&!f.dir){imgSet[p.replace(/\.jpe?g$/i,'')]=p;imgCount++;}});
    const stats={
      productos:products.length,
      categorias:catRows.length,
      ventas:+bkScalar(db,'SELECT COUNT(*) FROM venta')||0,
      clientes:+bkScalar(db,'SELECT COUNT(*) FROM cliente')||0,
      proveedores:+bkScalar(db,'SELECT COUNT(*) FROM proveedor')||0,
      compras:+bkScalar(db,'SELECT COUNT(*) FROM compra')||0,
      imagenes:imgCount,
      fmin:bkScalar(db,'SELECT MIN(fecha) FROM venta')||'',
      fmax:bkScalar(db,'SELECT MAX(fecha) FROM venta')||'',
      valorVenta:products.reduce((a,p)=>a+(p.cantidad||0)*(p.p_venta||0),0),
      valorCosto:products.reduce((a,p)=>a+(p.cantidad||0)*(p.p_compra||0),0)
    };
    db.close();
    BKZIP=zip;
    state.bk={biz,catMap,products,clients,sales,saleLines:linesByFolio,stats,imgSet,fileName:file.name};
    state.bkLoading=false;state.bkImgUrls={};
    bkImportAll();   // al cargar el .mn se importa todo automáticamente
  }catch(e){
    state.bkLoading=false;state.bkErr=(e&&e.message)||('error');BKZIP=null;render();
  }
}
async function bkLoadThumbs(){
  if(!state.bk||!BKZIP)return;state.bkImgUrls=state.bkImgUrls||{};

function bkImportAll(){
  if(!state.bk)return;
  const imgSet=state.bk.imgSet||{};
  const prods=state.bk.products.map(p=>{
    const key=(p.key||'').trim();
    const o={key,name:(p.nombre||'').trim(),cat:state.bk.catMap[p.categoria]||'',stock:+p.cantidad||0,cost:+p.p_compra||0,price:+p.p_venta||0,reserve:+p.reserva||0};
    if(key&&imgSet[key])o.imgKey=key;
    return o;
  }).filter(p=>p.name);
  const pr=importProducts(prods,true);      // sin navegar
  const cl=bkMergeClients();                // clientes
  const sv=bkMergeSales();                  // ventas (historial)
  persist();persistSales();                 // ventas -> IndexedDB (evita el límite de localStorage)
  const withImg=prods.filter(p=>p.imgKey);
  if(withImg.length)bkSaveImages(withImg);  // fotos en segundo plano
  if(state.bk.saleLines)bkSaveSaleLines(state.bk.saleLines); // detalle de ventas -> IndexedDB
  state.bk.imported={p:state.products.length,c:state.clients.length,v:sv};
  render();
}
function bkMergeSales(){
  if(!state.bk||!state.bk.sales||!state.bk.sales.length)return 0;
  const have=new Set(state.sales.map(s=>''+s.id));
  const add=state.bk.sales.filter(s=>!have.has(''+s.id));
  state.sales=state.sales.concat(add).sort((a,b)=>(saleDate(b)+' '+(b.time||'')).localeCompare(saleDate(a)+' '+(a.time||'')));
  return add.length;
}
function bkMergeClients(){
  let added=0,updated=0;
  if(state.bk&&state.bk.clients)state.bk.clients.forEach(c=>{
    const name=(c.nombre_cliente||'').trim();if(!name)return;
    const data={name,alias:(c.alias||'').trim(),phone:(c.telefono1||'').trim(),email:(c.correo||'').trim(),address:(c.direccion||'').trim(),notes:(c.info_adicional||'').trim()};
    const ex=state.clients.find(x=>(x.name||'').toLowerCase()===name.toLowerCase());
    if(ex){Object.assign(ex,data);updated++;}else{state.clients.push({id:'C'+Date.now()+Math.floor(Math.random()*1e6),...data});added++;}
  });
  return {added,updated};
}

function _setLocal(key,val){CACHE[key]=val;try{localStorage.setItem('abanico.'+key,JSON.stringify(val))}catch(_){}}
function _get(key,def){

}
function _set(key,val){

  try{localStorage.setItem('abanico.'+key,JSON.stringify(val))}catch(_){}

}
function _applySnap(key,val){

/* notificaciones por entidad */
function loadNotif(id){return _get('notif.'+id,[]);}
function saveNotif(id,l){_set('notif.'+id,l);}
function pushNotif(id,n){
  const item={nid:Date.now()+''+Math.floor(Math.random()*1e4),read:false,...n};
  // Cross-device: when notifying ANOTHER entity, read its current notifs fresh from the db
  // before appending, so we don't overwrite/resurrect its already-seen items from a stale cache.
  if(DBH&&id!==currentDataId()){
    (async()=>{
      let cur=[];
      try{const s=await DBH.doc(_docPath('notif.'+id)).get();const d=s&&s.data&&s.data();if(d&&('v'in d))cur=d.v||[];}catch(_){cur=loadNotif(id);}
      const l=[item,...cur];CACHE['notif.'+id]=l;
      try{localStorage.setItem('abanico.notif.'+id,JSON.stringify(l))}catch(_){}
      try{await DBH.doc(_docPath('notif.'+id)).set({v:l})}catch(_){}
    })();
    return;
  }
  const l=loadNotif(id).slice();l.unshift(item);saveNotif(id,l);
}
function unreadCount(id){return id?loadNotif(id).filter(n=>!n.read).length:0;}
/* append an item to a shared list doc without clobbering others' entries from a stale cache */
function appendShared(key,item,cap){
  if(DBH){
    (async()=>{
      let cur=[];
      try{const s=await DBH.doc(_docPath(key)).get();const d=s&&s.data&&s.data();if(d&&('v'in d))cur=d.v||[];}catch(_){cur=_get(key,[]);}
      let l=[item,...cur];if(cap&&l.length>cap)l=l.slice(0,cap);
      CACHE[key]=l;try{localStorage.setItem('abanico.'+key,JSON.stringify(l))}catch(_){}
      try{await DBH.doc(_docPath(key)).set({v:l})}catch(_){}
    })();
    return;
  }
  let l=[item,..._get(key,[])];if(cap&&l.length>cap)l=l.slice(0,cap);_set(key,l);
}

  if(!b){toast(t('bodega_not_found'));return;}
  const tid=state.profile.id;const ex=reqBetween(tid,bid);
  if(ex&&ex.status==='approved'){toast(t('already_linked'));return;}

}

}
function setReqStatus(reqId,status){
  const l=loadReq();const r=l.find(x=>x.reqId===reqId);if(!r)return;r.status=status;saveReq(l);
  const b=getEntity('bodega',r.bodegaId);
  pushNotif(r.tiendaId,{kind:status==='approved'?'approved':'denied',text:ti(status==='approved'?'n_approved':'n_denied',{b:b?b.name:r.bodegaId})});
  const bl=loadNotif(r.bodegaId);bl.forEach(n=>{if(n.reqId===reqId){n.read=true;n.done=true;}});saveNotif(r.bodegaId,bl);
  render();if(document.getElementById('notifdlg').classList.contains('on'))openNotifs();
  toast(status==='approved'?t('approved_done'):t('rejected_done'));
}
function unlinkTienda(tid){
  const bid=state.profile.id;
  saveReq(loadReq().filter(r=>!(r.bodegaId===bid&&r.tiendaId===tid)));
  pushNotif(tid,{kind:'unlinked',text:ti('n_unlinked',{b:state.profile.name})});
  render();toast(t('unlinked_done'));
}
function unlinkAllTiendas(){
  const bid=state.profile.id;const tids=linkedTiendas(bid);
  saveReq(loadReq().filter(r=>r.bodegaId!==bid));
  tids.forEach(tid=>pushNotif(tid,{kind:'unlinked',text:ti('n_unlinked',{b:state.profile.name})}));
  render();toast(t('unlinked_all_done'));
}
function addFromCatalog(bid,pid){
  const d=loadDataOf(bid);const bp=(d.products||[]).find(p=>p.id===pid);if(!bp)return;
  if(bp.stock<=0){toast(t('no_stock'));return;}
  bp.stock-=1;
  d.dispatches=d.dispatches||[];
  const dl=d.dispatches.find(z=>z.tid===state.profile.id&&z.pid===pid);
  if(dl){dl.qty+=1;dl.name=bp.name;}else d.dispatches.push({tid:state.profile.id,tname:state.profile.name,pid,name:bp.name,qty:1});
  saveDataOf(bid,d);
  let mine=state.products.find(p=>p.origin&&p.origin.bid===bid&&p.origin.pid===pid);
  if(mine)mine.stock+=1;else state.products.push({id:state.seq++,key:bp.key,name:bp.name,cat:bp.cat,unit:bp.unit,cost:bp.price,price:bp.price,addSale:0,stock:1,reserve:0,img:bp.img||null,expiry:null,origin:{bid,pid}});
  persist();pushNotif(bid,{kind:'dispatch',text:ti('n_dispatch',{t:state.profile.name,n:1,p:bp.name})});
  render();toast(t('added_to_inv'));
}
function openNotifs(){
  const id=currentDataId();
  // Purge informational notifs already seen in a previous open; keep pending requests until acted on
  const list=loadNotif(id).filter(n=>!n.read||(n.kind==='request'&&!n.done));saveNotif(id,list);
  document.getElementById('notifH').textContent=t('notifs');
  document.getElementById('notifOptions').innerHTML=list.length?list.map(n=>{
    const act=(n.kind==='request'&&!n.done)?`<div style="display:flex;gap:6px;margin-top:9px"><button class="add-btn" data-act="approve:${n.reqId}">${t('approve')}</button><button class="add-btn" style="border-color:var(--red);color:var(--red)" data-act="deny:${n.reqId}">${t('deny')}</button></div>`:'';
    return `<div class="notirow ${n.read?'':'unread'}"><div class="ntext">${n.text}</div>${act}</div>`;
  }).join(''):`<div class="empty">${t('no_notifs')}</div>`;
  document.getElementById('notifdlg').classList.add('on');
  list.forEach(n=>n.read=true);saveNotif(id,list);
  const bd=document.getElementById('bellDot');if(bd)bd.hidden=true;
}
function closeNotifs(){document.getElementById('notifdlg').classList.remove('on');}

const TOASTS={notif:'notif',more:'more',scanner:'scanner',categories:'categories',filters:'filters',addmove:'addMove',closereg:'closeRegDemo'};
document.getElementById("device").addEventListener("click",e=>{
  if(e.target.id==='catdlg')return closeCat();
  if(e.target.id==='notifdlg')return closeNotifs();
  if(e.target.id==='iodlg')return closeIO();
  if(e.target.id==='clidlg')return closeCli();
  if(e.target.id==='saledlg')return closeSale();
  const el=e.target.closest("[data-nav],[data-inc],[data-dec],[data-stock],[data-act],[data-drawer],[data-di],[data-fab],[data-edit],[data-catpick],[data-pick],[data-catalog],[data-addcat],[data-tienda],[data-cliedit],[data-saledet]");
  if(!el)return;
  if(el.hasAttribute("data-pick")){const[r,id]=el.dataset.pick.split(':');return obPick(r,id);}
  if(el.hasAttribute("data-saledet"))return openSaleDet(el.dataset.saledet);
  if(el.hasAttribute("data-cliedit"))return openCliForm(el.dataset.cliedit);
  if(el.hasAttribute("data-tienda")){state.detTienda=el.dataset.tienda;return go('tiendadet');}
  if(el.hasAttribute("data-catalog")){state.catBodega=el.dataset.catalog;watchKey('data.'+el.dataset.catalog);dbFetch('data.'+el.dataset.catalog);return go('catalogo');}
  if(el.hasAttribute("data-addcat")){state._keep=document.getElementById("screen").scrollTop;const[bid,pid]=el.dataset.addcat.split(':');return addFromCatalog(bid,+pid);}
  if(el.hasAttribute("data-catpick")){const v=el.dataset.catpick;state.filterCat=v==='__all__'?null:v;closeCat();return render();}
  state._keep=document.getElementById("screen").scrollTop;
  if(el.dataset.drawer)return drawer(el.dataset.drawer==="open");
  if(el.hasAttribute("data-di")){if(el.dataset.soon==="1"){drawer(false);return toast(t('m_'+el.dataset.di)+" · "+t('soon'));}return go(el.dataset.di);}
  if(el.hasAttribute("data-fab"))return state.screen==="inventario"?openForm():go("nueva");
  if(el.hasAttribute("data-edit"))return openForm(+el.dataset.edit);
  if(el.dataset.nav)return go(el.dataset.nav);
  if(el.dataset.inc){const id=+el.dataset.inc;state.cart[id]=(state.cart[id]||0)+1;return render();}
  if(el.dataset.dec){const id=+el.dataset.dec;state.cart[id]=Math.max(0,(state.cart[id]||0)-1);return render();}
  if(el.dataset.stock){const[id,dd]=el.dataset.stock.split(":");const p=P(+id);if(p)p.stock=Math.max(0,p.stock+ +dd);persist();return render();}
  if(el.dataset.act){const a=el.dataset.act.split(":")[0];
    if(a==="checkout")return checkout();
    if(a==="clearq"){state.q="";return render();}
    if(a==="close-form")return closeForm();
    if(a==="save-product")return saveProduct();
    if(a==="genkey")return genKey();
    if(a==="del-product")return delProduct();
    if(a==="filtercat")return openCatFilter();
    if(a==="rm-img"){readForm();state.form.img=null;document.getElementById('formBody').innerHTML=formHTML();return attachForm();}
    if(a==="perm-allow")return permResult(true);
    if(a==="perm-deny")return permResult(false);
    if(a==="ob")return obAction(el.dataset.act.slice(3));
    if(a==="logout")return doLogout();
    if(a==="notifs")return openNotifs();
    if(a==="close-sheet"){closeCat();closeNotifs();closeIO();closeCli();closeSale();return;}
    if(a==="soon")return toast(t('soon'));
    if(a==="salescsv")return exportSalesCSV();
    if(a==="hist")return openHist();
    if(a==="closehist")return closeHist();
    if(a==="histmore"){const b=document.getElementById('histBody');const p=b.scrollTop;HIST_LIMIT+=INV_PAGE*2;fillHist();b.scrollTop=p;return;}
    if(a==="cli"){const sub=el.dataset.act.split(":")[1];if(sub==='new')return openCliForm(null);if(sub==='save')return saveClient();if(sub==='del')return delClient();return;}
    if(a==="io"){const sub=el.dataset.act.split(":")[1];if(sub==='csv')return doExportCSV();if(sub==='json')return doExportJSON();if(sub==='import')return triggerImport();return openIO();}
    if(a==="bk"){const sub=el.dataset.act.split(":")[1];if(sub==='pick')return bkPick();if(sub==='reset')return bkReset();if(sub==='seeinv')return go('inventario');if(sub==='seecli')return go('clientes');if(sub==='seeven')return go('ventas');return;}
    if(a==="invmore"){state.invLimit=(state.invLimit||INV_PAGE)+INV_PAGE*2;return render();}
    if(a==="reqaccess")return requestAccess();
    if(a==="approve")return setReqStatus(el.dataset.act.split(":")[1],'approved');
    if(a==="deny")return setReqStatus(el.dataset.act.split(":")[1],'denied');
    if(a==="unlink")return unlinkTienda(el.dataset.act.split(":")[1]);
    if(a==="unlinkall")return unlinkAllTiendas();
    if(a==="toast"){const key=el.dataset.act.split(":")[1];return toast(t(TOASTS[key]||'more'));}
  }
});
document.getElementById("ioFile").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(file)handleImportFile(file);});
document.getElementById("bkFile").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(file)bkHandleFile(file);});
document.getElementById("histBody").addEventListener("scroll",()=>{
  const b=document.getElementById("histBody");
  if(b.scrollTop+b.clientHeight>=b.scrollHeight-500&&HIST_LIMIT<state.sales.length){const p=b.scrollTop;HIST_LIMIT+=INV_PAGE;fillHist();b.scrollTop=p;}
},{passive:true});
document.getElementById("screen").addEventListener("scroll",()=>{
  if(state.screen!=='inventario')return;
  const sc=document.getElementById("screen");
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-500&&document.querySelector('.loadmore')){
    state._keep=sc.scrollTop;state.invLimit=(state.invLimit||INV_PAGE)+INV_PAGE;render();
  }
},{passive:true});
boot();
</script>
